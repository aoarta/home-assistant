# packages/control.yaml

#########
## The Control Logic: Setting the Dynamic SOC
#########

input_boolean:
  override_soc:
    name: "Manual SOC Override"
    icon: mdi:battery-lock

  # Wartungsladung der USV. Frueher wurde das ueber
  # "manual_charge_power >= 1000" mitgesteuert - das war ein Fehler:
  # "Battery Maintenance: Stop When Full" prueft nur den SOC der beiden
  # Venus und setzt manual_charge_power auf 0, sobald DIE voll sind.
  # Damit fiel maintenance_activ in ups_coarse_control weg, lange bevor
  # die USV geladen war (Venus: ~30 min, USV: 3-5 h).
  # Jetzt getrennt: manual_charge_power = reine Venus-Ladeleistung,
  # dieses Flag = USV-Wartung.
  # Geschrieben von: battery_maintenance_ups_charge / _ups_stop (ups_batterie.yaml)
  # Gelesen von:     ups_coarse_control -> maintenance_activ
  ups_maintenance:
    name: "USV Wartungsladung"
    icon: mdi:battery-heart

input_number:
  # Manuelle Ladevorgabe in W je Speicher.
  #   0      = aus, normale Regelung laeuft
  #   > 0    = charge_map setzt beide Venus fest auf diesen Wert (target_soc -> 110)
  #   >= 1000 = ups_coarse_control wertet das als Wartungsmodus
  # Max 2500 W entspricht der Grenze in charge_map / sende_batterie_targets_v3.
  # Kein "initial:" -> der Wert ueberlebt einen Neustart, damit eine laufende
  # Wartungsladung nicht stillschweigend abbricht. Beendet wird sie von
  # "Battery Maintenance: Stop When Full".
  manual_charge_power:
    name: "Manual Charge Power"
    min: 0
    max: 2500
    step: 50
    unit_of_measurement: "W"
    mode: box
    icon: mdi:battery-charging-high

input_datetime:
  # Zeitstempel "Batterie war zuletzt voll".
  # Geschrieben von: marstek_set_last_full_timestamp (Venus 1/2) und
  #                  ups_set_last_full_timestamp (USV).
  # Gelesen von:     binary_sensor.battery_maintenance_required und
  #                  soc_override_weekly_control.
  venus_1_last_full:
    name: "Venus 1 zuletzt voll"
    has_date: true
    has_time: true
    icon: mdi:battery-clock

  venus_2_last_full:
    name: "Venus 2 zuletzt voll"
    has_date: true
    has_time: true
    icon: mdi:battery-clock

  ups_last_full:
    name: "USV zuletzt voll"
    has_date: true
    has_time: true
    icon: mdi:battery-clock

template:
  - sensor:
      - name: "Solar SOC Logic"
        unique_id: solar_soc_logic
        availability: "{{ state_attr('sun.sun', 'next_setting') is not none }}"
        state: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set next_rising = as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set next_setting = as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set today_rising = next_rising - 86400 if next_rising > now_ts else next_rising %}
          {% set today_setting = next_setting - 86400 if next_setting > as_timestamp(now().replace(hour=23, minute=59)) else next_setting %}
          {{ 'Day' if today_rising <= now_ts <= today_setting else 'Night' }}
        attributes:
          now_ts: "{{ as_timestamp(now()) }}"
          sun_rise: >-
            {% set ts = as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
            {{ ts - 86400 if ts > as_timestamp(now()) else ts }}
          sun_set: >-
            {% set ts = as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
            {{ ts - 86400 if ts > as_timestamp(now().replace(hour=23, minute=59)) else ts }}
          t1115: "{{ as_timestamp(now().replace(hour=11, minute=15, second=0, microsecond=0)) }}"
          sun_set_minus_3h: >-
            {% set ts = as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
            {% set today_set = ts - 86400 if ts > as_timestamp(now().replace(hour=23, minute=59)) else ts %}
            {{ today_set - 3*3600 }}
          min: "{{ [10, state_attr('sensor.global_parameter', 'stop_soc') | float(10)] | max }}"
          low: "{{ [60, state_attr('sensor.global_parameter', 'stop_soc') | float(60)] | max }}"
          mid: "{{ [80, state_attr('sensor.global_parameter', 'stop_soc') | float(80)] | max }}"
          high: "{{ [90, state_attr('sensor.global_parameter', 'stop_soc') | float(90)] | max }}"
          max: "{{ [100.5, state_attr('sensor.global_parameter', 'stop_soc') | float(100.5)] | max }}"

      - name: "Battery AC Power total"
        unique_id: battery_ac_power_total
        # description: "for dashboard"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set venus1 = states('sensor.marstek_venus_1_ac_power') | float(0) %}
          {% set venus2 = states('sensor.marstek_venus_2_ac_power') | float(0) %}
          {% set ups = states('sensor.ups_ac_power') | float(0) %}
          {{ (venus1 + venus2 + ups) | round(0) }}

      - name: "Remaining PV Today"
        # description: "for dashboard"
        unique_id: remaining_pv_today
        unit_of_measurement: "kWh"
        state: >-
          {% set pv_forecast_today = states('sensor.pv_forecast_weighted') | float(0) %}
          {{ ([0, pv_forecast_today] | max) | round(2) }}

      - name: "Dynamic SOC"
        unique_id: dynamic_soc
        unit_of_measurement: "%"
        state: >-
          {% set ts = as_timestamp(now()) %}
          {% set s_rise = state_attr('sensor.solar_soc_logic', 'sun_rise') | float(0) %}
          {% set t1115 = state_attr('sensor.solar_soc_logic', 't1115') | float(0) %}
          {% set sun_set_minus_3h = state_attr('sensor.solar_soc_logic', 'sun_set_minus_3h') | float(0) %}
          {% set s_set = state_attr('sensor.solar_soc_logic', 'sun_set') | float(0) %}

          {% if is_state('sun.sun', 'below_horizon') %}
            {{ state_attr('sensor.solar_soc_logic', 'min') | float(20) }}
          {% elif ts < t1115  %}
            {{ state_attr('sensor.solar_soc_logic', 'low') | float(60) }}
          {% elif ts < sun_set_minus_3h %}
            {{ state_attr('sensor.solar_soc_logic', 'mid') | float(80) }}
          {% elif ts < s_set %}
            {{ state_attr('sensor.solar_soc_logic', 'high') | float(90) }}
          {% else %}
            {{ state_attr('sensor.solar_soc_logic', 'min') | float(20) }}
          {% endif %}

      - name: "Target SOC Status"
        unique_id: target_soc_status
        icon: mdi:battery-clock
        state: >-
          {% set t = states('sensor.target_soc') | float(-1) %}
          {% if t == 101 %}
            Manual override active — charging to 100%
          {% elif t == 110 %}
            Manual charge power set — target ignored
          {% elif t == 120 %}
            Battery maintenance cycle — charging to 100%
          {% elif t == 130 %}
            Today's energy balance negative — charging to 100% now
          {% elif t == 131 %}
            Tomorrow's energy balance negative — charging to 100%
          {% elif t == 133 %}
            Day after tomorrow's energy balance negative — charging to 100%
          {% else %}
            {% set dynamic = states('sensor.dynamic_soc') | float(0) %}
            {% set grenzen_max = state_attr('sensor.solar_soc_logic', 'max') | float(100.5) %}
            {% if t | float(-1) == grenzen_max %}
              PV surplus insufficient for dynamic target — cap opened to max
            {% elif t == dynamic | float %}
              Following dynamic schedule — target {{ t }}%
            {% else %}
              Unknown state ({{ t }})
            {% endif %}
          {% endif %}

  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - input_number.manual_charge_power
          - input_boolean.override_soc
          - binary_sensor.battery_maintenance_required
    sensor:
      - name: "Expected Remaining Consumption Today"
        unique_id: expected_remaining_consumption_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        icon: mdi:home-lightning-bolt-outline
        availability: >-
          {{ has_value('sensor.expected_daily_consumption')
             and has_value('sensor.house_consumption_energy_today') }}
        state: >-
          {% set expected_daily_consumption = states('sensor.expected_daily_consumption') | float(0) %}
          {% set hausverbrauch_heute = states('sensor.house_consumption_energy_today') | float(0) %}
          {{ ([0, expected_daily_consumption - hausverbrauch_heute] | max) | round(2) }}

      - name: "Target SOC"
        unique_id: target_soc
        unit_of_measurement: "%"
        state: >-
          {# Reihenfolge: Wartung VOR Manual. Beide liefern >100 (= voll laden),
             aber waehrend der Wartungsladung steht manual_charge_power auf 1000,
             wodurch frueher immer 110 ("Manual charge power set") angezeigt wurde
             statt 120 ("Battery maintenance cycle"). Rein kosmetisch fuer
             sensor.target_soc_status, aber beim Debuggen irrefuehrend. #}
          {% if is_state('input_boolean.override_soc', 'on') %}
            101
          {% elif is_state('binary_sensor.battery_maintenance_required', 'on') %}
            120
          {% elif states('input_number.manual_charge_power') | float(0) > 0 %}
            110
          {% else %}
            {# === Usable energy in battery (discharge capacity, incl. safety margin) === #}
            {% set usable_energy = states('sensor.marstek_usable_energy') | float(0) %}

            {# === Max storable energy (battery cap) === #}
            {% set max_storage = state_attr('sensor.global_parameter', 'calculated_combined_capacity_kwh') | float(10) %}

            {# === Today (remaining) === #}
            {% set pv_forecast_today = states('sensor.pv_forecast_weighted') | float(0) %}
            {% set pv_remaining_today = pv_forecast_today %}
            {% set expected_daily_consumption = states('sensor.expected_daily_consumption') | float(5) %}
            {% set consumption_today = states('sensor.house_consumption_energy_today') | float(5) %}

            {% set estimated_consumption = states('sensor.estimated_remaining_consumption') | float(consumption_today) %}
            {% set expected_consumption = states('sensor.expected_remaining_consumption_today') | float(consumption_today) %}
            {% set consumption_blended = (estimated_consumption + expected_consumption) / 2 %}
            {% set consumption_remaining_today = consumption_blended %}

            {# === Tomorrow === #}
            {% set pv_tomorrow = states('sensor.pv_forecast_weighted_tomorrow') | float(0) %}
            {% set consumption_tomorrow = states('sensor.expected_daily_consumption_tomorrow') | float(expected_daily_consumption) %}

            {# === Day after tomorrow === #}
            {% set pv_day_after = states('sensor.pv_forecast_weighted_day_after') | float(0) %}
            {% set consumption_day_after = states('sensor.expected_daily_consumption_day_after') | float(expected_daily_consumption) %}

            {# === Rolling balance: simulate battery state over the next days === #}
            {% set balance_today = [usable_energy + pv_remaining_today - consumption_remaining_today, max_storage] | min %}
            {% set balance_tomorrow = [balance_today + pv_tomorrow - consumption_tomorrow, max_storage] | min %}
            {% set balance_day_after = [balance_tomorrow + pv_day_after - consumption_day_after, max_storage] | min %}

            {# === Decision: most urgent shortfall wins === #}
            {% if balance_today < 0 %}
              130
            {% elif balance_tomorrow < 0 %}
              131
            {% elif balance_day_after < 0 %}
              133
            {% else %}
              {# No multi-day shortfall — normally follow the dynamic schedule.        #}
              {# But: if today's remaining PV surplus cannot lift the battery to the   #}
              {# dynamic target, open the cap to maximum to capture every available    #}
              {# Wh instead of exporting it.                                           #}
              {% set target = states('sensor.dynamic_soc') | float(50) %}

              {# Energy still chargeable into the battery from today's PV (after house load) #}
              {% set chargeable_pv = [0, pv_remaining_today - consumption_remaining_today] | max %}
              {% set projected_energy = usable_energy + chargeable_pv %}

              {# Energy level the dynamic target corresponds to #}
              {% set target_energy = (target / 100) * max_storage %}

              {% if projected_energy < target_energy %}
                {{ state_attr('sensor.solar_soc_logic', 'max') }}
              {% else %}
                {{ target }}
              {% endif %}
            {% endif %}
          {% endif %}

  - binary_sensor:
      - name: "Battery Maintenance Required"
        unique_id: battery_maintenance_required
        state: >-
          {% set v1_last = states('input_datetime.venus_1_last_full') %}
          {% set v2_last = states('input_datetime.venus_2_last_full') %}
          {% set ups_last = states('input_datetime.ups_last_full') %}

          {% set days = state_attr('sensor.global_parameter', 'battery_care_days') | float(5) %}
          {% set threshold = days * 86400 %} {# in seconds #}
          {% set now_ts = as_timestamp(now()) %}

          {# Fallback to 0 to avoid false triggers on restarts/connection drops.
             as_timestamp also secured with default value (now_ts). #}
          {% set v1_age = (now_ts - as_timestamp(v1_last, now_ts)) if has_value('input_datetime.venus_1_last_full') else 0 %}
          {% set v2_age = (now_ts - as_timestamp(v2_last, now_ts)) if has_value('input_datetime.venus_2_last_full') else 0 %}
          {% set ups_age = (now_ts - as_timestamp(ups_last, now_ts)) if has_value('input_datetime.ups_last_full') else 0 %}

          {{ v1_age > threshold or v2_age > threshold or ups_age > threshold }}
        attributes:
          # as_timestamp also secured with default (0) here to avoid log errors
          v1_days: "{{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.venus_1_last_full'), as_timestamp(now()))) / 86400) | int if has_value('input_datetime.venus_1_last_full') else '?' }}"
          v2_days: "{{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.venus_2_last_full'), as_timestamp(now()))) / 86400) | int if has_value('input_datetime.venus_2_last_full') else '?' }}"
          ups_days: "{{ ((as_timestamp(now()) - as_timestamp(states('input_datetime.ups_last_full'), as_timestamp(now()))) / 86400) | int if has_value('input_datetime.ups_last_full') else '?' }}"
