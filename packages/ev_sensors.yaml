# ============================================================
# PV surplus wallbox charging (WARP3) - Trigger Sensors
#
# Die Ueberschussrechnung liegt direkt in "EV Target Charging Current".
# Die frueheren Zwischensensoren sensor.pv_dynamic_charging_current und
# sensor.pv_dynamic_charging_current_battery_first entfallen - der
# zugehoerige Block in ev_sensors.yaml muss geloescht werden, die beiden
# verwaisten Entities danach in der Entitaeten-Liste entfernen.
#
# MODUS 6 "target_time": Fahrzeug soll bis input_datetime.ev_target_time
# auf input_number.ev_charge_to_percent geladen sein.
#   Phase "pv"    - nur PV-Ueberschuss, gedeckelt auf ev_pv_precharge_max_soc
#   Phase "paced" - Batterietempo: so viel, wie die Hausspeicher tragen
#   Phase "full"  - alles was geht, Netz inbegriffen (Notfallstufe)
# Die beiden Startzeitpunkte laufen rechnerisch exakt bei Ladeende zusammen:
# laeuft alles nach Plan, wird "full" nie erreicht; faellt die Ladung zurueck,
# greift die Stufe von selbst. Kein Helper, kein Latch, keine Hysterese.
# ============================================================

# ============================================================
# PV surplus wallbox charging (WARP3) - Sensors
#
# SoC-Tracking liegt in ev_soc.yaml.
# Die Ueberschussrechnung (frueher "PV Dynamic Charging Current" und
# "... Battery First") liegt jetzt in den variables von
# sensor.ev_target_charging_current in ev_sensor_trigger.yaml.
# ============================================================

template:
  # ----------------------------------------------------------
  # Session-Energie
  # ----------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id: sensor.warp3_2ita_energyabs
      - trigger: state
        entity_id: input_number.ev_session_start_energy_kwh
    sensor:
      - name: "EV Session Energy"
        unique_id: ev_session_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set meter = states('sensor.warp3_2ita_energyabs') | float(-1) %}
          {% set start = states('input_number.ev_session_start_energy_kwh') | float(-1) %}
          {% if meter < 0 or start < 0 %}
            0
          {% else %}
            {{ [meter - start, 0] | max | round(3) }}
          {% endif %}

  # ----------------------------------------------------------
  # Uebrige EV-Sensoren
  # ----------------------------------------------------------
  - sensor:
      - name: "EV Max Charge Energy"
        unique_id: ev_max_charge_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >-
          {% set mode = states('input_select.ev_vehicle_mode') %}
          {% set pct = states('input_number.ev_charge_by_percent') | float(0) %}
          {% if mode == 'off' or pct == 0 %}
            0
          {% else %}
            {% if mode == 'zero' %}
              {% set capacity = state_attr('sensor.global_parameter', 'zero_sr_capacity') | float(0) %}
              {% set efficiency = state_attr('sensor.global_parameter', 'zero_sr_charge_efficiency') | float(0.88) %}
            {% elif mode == 'honda_e' %}
              {% set capacity = state_attr('sensor.global_parameter', 'honda_e_capacity') | float(0) %}
              {% set efficiency = state_attr('sensor.global_parameter', 'honda_e_charge_efficiency') | float(0.88) %}
            {% else %}
              {% set capacity = 0 %}
              {% set efficiency = 1 %}
            {% endif %}
            {% if capacity == 0 or efficiency == 0 %}
              0
            {% else %}
              {{ (capacity * pct / 100 / efficiency) | round(2) }}
            {% endif %}
          {% endif %}

      - name: "EV Charging Power"
        unique_id: ev_charging_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {# (0 - power) statt -power: sonst rendert Jinja bei 0 ein "-0.0" #}
          {{ (0 - (states('sensor.warp3_2ita_powernow') | float(0))) | round(0) | int }}

      # ----------------------------------------------------------
      # Rohwert-Spiegel zum Gegenpruefen der Hochrechnung.
      # Werden von keinem Template gelesen - nur Dashboard/Diagnose.
      # ----------------------------------------------------------
      - name: "Zero SOC last seen"
        unique_id: zero_sr_soc_last_seen
        unit_of_measurement: "%"
        state: >-
          {% set raw = states('sensor.zero_sr_batteriestand') %}
          {% if is_number(raw) %}
            {{ raw | float | round(1) if raw | float(-1) > 0 else this.state | float(-1) }}
          {% else %}
            {{ this.state | float(-1) }}
          {% endif %}

      - name: "honda_e SOC last seen"
        unique_id: honda_e_soc_last_seen
        unit_of_measurement: "%"
        state: >-
          {% set raw = states('sensor.honda_e_batteriestand') %}
          {% if is_number(raw) %}
            {{ raw | float | round(0) }}
          {% else %}
            {{ this.state | float(0) }}
          {% endif %}

  - binary_sensor:
      - name: "Zero SR connected"
        unique_id: zero_sr_connected
        device_class: plug
        delay_on: "00:02:00"
        delay_off: "00:00:15"
        state: >-
          {{ is_state('binary_sensor.warp3_2ita_cable', 'on')
             and has_value('sensor.zero_sr_batteriestand')
             and states('sensor.zero_sr_batteriestand') | float(-1) > 0 }}

      - name: "Honda e connected"
        unique_id: honda_e_connected
        device_class: plug
        delay_on: "00:02:30"
        delay_off: "00:00:15"
        state: >-
          {{ is_state('binary_sensor.warp3_2ita_cable', 'on')
             and not is_state('binary_sensor.zero_sr_connected', 'on') }}
