# ============================================================
# PV surplus wallbox charging (WARP3) - Sensors
# SoC-Tracking liegt in ev_soc.yaml
# ============================================================

template:
  - trigger:
      - platform: time_pattern
        seconds: "/30"
      - platform: state
        entity_id:
          - sensor.warp3_2ita_powernow
          - sensor.leistung_vom_netz
          - sensor.marstek_venus_1_ac_power_glatt
          - sensor.marstek_venus_2_ac_power_glatt
    variables:
      cable_connected: "{{ is_state('binary_sensor.warp3_2ita_cable', 'on') }}"
      charger_power: "{{ states('sensor.warp3_2ita_powernow') | float(0) }}"
      power_from_net: "{{ states('sensor.leistung_vom_netz') | float(0) }}"
      venus1: "{{ states('sensor.marstek_venus_1_ac_power_glatt') | float(0) }}"
      venus2: "{{ states('sensor.marstek_venus_2_ac_power_glatt') | float(0) }}"
      charger_voltage: "{{ states('sensor.smart_meter_ts_65a_3_spannung_l1') | float(235) }}"
      max_amps: "{{ state_attr('sensor.global_parameter', 'wallbox_max_amps') | float(16) }}"
    sensor:
      # ----------------------------------------------------------
      # 1. PV Dynamic Current (EV FIRST)
      # Hausbatterie-Ladestrom (negativer Wert) wird freigegeben.
      # ----------------------------------------------------------
      - name: "PV Dynamic Charging Current"
        unique_id: pv_dynamic_charging_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        state: >-
          {% if not cable_connected %}
            0
          {% else %}
            {% set surplus = charger_power - power_from_net - venus1 - venus2 %}
            {% set amps = (surplus / charger_voltage + 0.2) | int %}
            {{ [amps, max_amps] | min if amps >= 6 else 0 }}
          {% endif %}

      # ----------------------------------------------------------
      # 2. PV Dynamic Current (BATTERY FIRST)
      # Hausbatterie wird geschont. Ihr Ladestrom wird NICHT der Wallbox zugeschlagen.
      # ----------------------------------------------------------
      - name: "PV Dynamic Charging Current Battery First"
        unique_id: pv_dynamic_charging_current_battery_first
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        state: >-
          {% if not cable_connected %}
            0
          {% else %}
            {% set v1_clean = [venus1, 0] | max %}
            {% set v2_clean = [venus2, 0] | max %}
            {% set surplus = charger_power - power_from_net - v1_clean - v2_clean %}
            {% set amps = (surplus / charger_voltage + 0.2) | int %}
            {{ [amps, max_amps] | min if amps >= 6 else 0 }}
          {% endif %}

  # ----------------------------------------------------------
  # Session-Energie
  # ----------------------------------------------------------
  - trigger:
      - platform: state
        entity_id: sensor.warp3_2ita_energyabs
      - platform: state
        entity_id: input_number.ev_session_start_energy_kwh

    sensor:
      - name: "EV Session Energy"
        unique_id: ev_session_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set meter = states('sensor.warp3_2ita_energyabs') | float(-1) %}
          {% set start = states('input_number.ev_session_start_energy_kwh') | float(-1) %}
          {% if meter < 0 or start < 0 %}
            0
          {% else %}
            {{ [meter - start, 0] | max | round(3) }}
          {% endif %}

  # ----------------------------------------------------------
  # Uebrige EV-Sensoren
  # ----------------------------------------------------------
  - sensor:
      - name: "EV Max Charge Energy"
        unique_id: ev_max_charge_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >-
          {% set mode = states('input_select.ev_vehicle_mode') %}
          {% set pct = states('input_number.ev_charge_by_percent') | float(0) %}
          {% if mode == 'off' or pct == 0 %}
            0
          {% else %}
            {% if mode == 'zero' %}
              {% set capacity = state_attr('sensor.global_parameter', 'zero_sr_capacity') | float(0) %}
              {% set efficiency = state_attr('sensor.global_parameter', 'zero_sr_charge_efficiency') | float(0.88) %}
            {% elif mode == 'honda_e' %}
              {% set capacity = state_attr('sensor.global_parameter', 'honda_e_capacity') | float(0) %}
              {% set efficiency = state_attr('sensor.global_parameter', 'honda_e_charge_efficiency') | float(0.88) %}
            {% else %}
              {% set capacity = 0 %}
              {% set efficiency = 1 %}
            {% endif %}
            {% if capacity == 0 or efficiency == 0 %}
              0
            {% else %}
              {{ (capacity * pct / 100 / efficiency) | round(2) }}
            {% endif %}
          {% endif %}

      - name: "EV Charging Power"
        unique_id: ev_charging_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set power = states('sensor.warp3_2ita_powernow') | float(0) %}
          {{ (0 - power) | round(0) | int }}

      # ----------------------------------------------------------
      # Rohwert-Spiegel zum Gegenpruefen der Hochrechnung
      # ----------------------------------------------------------
      - name: "Zero SOC last seen"
        unique_id: zero_sr_soc_last_seen
        unit_of_measurement: "%"
        state: >-
          {% set raw = states('sensor.zero_sr_batteriestand') %}
          {% if is_number(raw) %}
            {{ raw | float | round(1) if raw | float(-1) > 0 else this.state | float(-1) }}
          {% else %}
            {{ this.state | float(-1) }}
          {% endif %}

      - name: "honda_e SOC last seen"
        unique_id: honda_e_soc_last_seen
        unit_of_measurement: "%"
        state: >-
          {% set raw = states('sensor.honda_e_batteriestand') %}
          {% if is_number(raw) %}
            {{ raw | float | round(0) }}
          {% else %}
            {{ this.state | float(0) }}
          {% endif %}

  - binary_sensor:
      - name: "Zero SR connected"
        unique_id: zero_sr_connected
        device_class: plug
        delay_on: "00:02:00"
        delay_off: "00:00:15"
        state: >-
          {{ is_state('binary_sensor.warp3_2ita_cable', 'on')
             and has_value('sensor.zero_sr_batteriestand')
             and states('sensor.zero_sr_batteriestand') | float(-1) > 0 }}

      - name: "Honda e connected"
        unique_id: honda_e_connected
        device_class: plug
        delay_on: "00:02:30"
        delay_off: "00:00:15"
        state: >-
          {{ is_state('binary_sensor.warp3_2ita_cable', 'on')
             and not is_state('binary_sensor.zero_sr_connected', 'on') }}
