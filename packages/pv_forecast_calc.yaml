# packages/pv_forecast_calc.yaml
template:
  - sensor:
      - name: "PV Forecast Solcast all"
        unique_id: pv_forecast_solcast_all
        unit_of_measurement: "kWh"
        availability: "{{ is_number(states('sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute')) }}"
        state: "{{ states('sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute') | float(0) | round(1) }}"

      - name: "PV Height Correction Factor"
        unique_id: pv_height_correction_factor
        unit_of_measurement: ""
        state: "1.053"

      - name: "PV Albedo Correction Factor"
        unique_id: pv_albedo_correction_factor
        unit_of_measurement: ""
        state: >-
          {% set month = now().month %}
          {% if month in [12, 1, 2, 3] %}
            1.1
          {% elif month in [4, 5, 10, 11] %}
            1.05
          {% else %}
            1.0
          {% endif %}

      - name: "PV Total Correction Factor"
        unique_id: pv_total_correction_factor
        unit_of_measurement: ""
        state: >-
          {{ ((states('sensor.pv_height_correction_factor') | float(1)) *
              (states('sensor.pv_albedo_correction_factor') | float(1))) | round(3) }}

  # ==========================================================================
  # Nachtabschaltung
  #
  # Der 5-Minuten-Takt laeuft nur noch tagsueber (Sonnenaufgang -45 min bis
  # Sonnenuntergang +30 min). Nachts behalten alle Sensoren dieses Blocks
  # ihren letzten Wert.
  #
  # ACHTUNG - warum es die 00:02-Ausnahme braucht:
  # Die *_today-Werte sind nachts NICHT null. Ab Mitternacht ist "today" der
  # neue Tag und der Stundenzeiger steht auf 00:xx, alle Tageslichtstunden
  # liegen also noch vor dem Cursor -> om_today/dw_today/fs_today und Solcasts
  # "verbleibende Leistung heute" liefern den KOMPLETTEN Tagesertrag des
  # neuen Tages. Ohne den 00:02-Lauf bliebe pv_forecast_weighted auf 0.0
  # stehen, control.yaml wuerde balance_today < 0 rechnen und target_soc auf
  # 130 setzen -> die Speicher stuenden fuers Budget-Laden des Autos nicht
  # zur Verfuegung und die Preissteuerung saehe Unterdeckung. (Aus dem Netz
  # geladen wird bei 130 allein nicht - charge_map nimmt ohne manual nur
  # Ueberschuss.)
  # Ausserdem waere pv_forecast_weighted_tomorrow um einen Tag verschoben.
  #
  # Der Sonnenaufgang-45min-Lauf sorgt fuer frische Werte vor dem
  # Morgen-Snapshot in pv_forecast_automations.yaml (Sonnenaufgang + Fetch
  # + 6 min).
  # ==========================================================================
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
        id: periodic
      - trigger: time
        at: "00:02:00"
        id: rollover
      - trigger: sun
        event: sunrise
        offset: "-00:45:00"
        id: predawn
      - trigger: homeassistant
        event: start
        id: startup
    condition:
      - condition: or
        conditions:
          # alles ausser dem 5-Minuten-Takt kommt immer durch
          - condition: template
            value_template: "{{ trigger.id is not defined or trigger.id != 'periodic' }}"
          # der 5-Minuten-Takt nur tagsueber
          - condition: sun
            after: sunrise
            after_offset: "-00:45:00"
            before: sunset
            before_offset: "00:30:00"
    variables:
      r_reg: 0.1
      bias: "{{ states('input_number.pv_forecast_bias_korrekturfaktor') | float(1) }}"
      # Nicht mehr in den Weighted-Sensoren verwendet (siehe dortige Kommentare) -
      # nur noch als Variable vorhanden, falls du den statischen Faktor
      # spaeter testweise wieder einbauen willst.
      total_correction: "{{ states('sensor.pv_total_correction_factor') | float(1) }}"

      bw_sc: "{{ (states('input_number.pv_kalman_score_solcast') | float(0)) / (states('input_number.pv_kalman_r_solcast') | float(0.1) + r_reg) }}"
      bw_fs: "{{ (states('input_number.pv_kalman_score_forecastsolar') | float(0)) / (states('input_number.pv_kalman_r_forecastsolar') | float(0.1) + r_reg) }}"
      bw_om: "{{ (states('input_number.pv_kalman_score_openmeteo') | float(0)) / (states('input_number.pv_kalman_r_openmeteo') | float(0.1) + r_reg) }}"
      bw_dw: "{{ (states('input_number.pv_kalman_score_dwd') | float(0)) / (states('input_number.pv_kalman_r_dwd') | float(0.1) + r_reg) }}"

      sc_today: "{{ states('sensor.pv_forecast_solcast_all') | float(0) }}"

      fs_today: >-
        {% from 'horizon_dach.jinja' import horizon_factor as hf_dach %}
        {% from 'horizon_fassade.jinja' import horizon_factor as hf_fassade %}
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set md = now().strftime('%m-%d') %}
        {% set dach = state_attr('sensor.forecastsolar_api_raw_dach_stable', 'result') %}
        {% set fassade = state_attr('sensor.forecastsolar_api_raw_fassade_stable', 'result') %}
        {% if dach is mapping and fassade is mapping %}
          {% set now_ts = now().timestamp() %}
          {% set tz = now().strftime('%z') %}
          {% set ns = namespace(prev_t=0, prev_v=0, rem=0) %}
          {% for ts, val in dach.items() if ts.startswith(today) %}
            {% set t = as_timestamp(ts ~ tz) %}
            {% set v = val | float(0) %}
            {% if ns.prev_t != 0 %}
              {% set delta = [v - ns.prev_v, 0] | max %}
              {% set h = (((ns.prev_t + t) / 2) | timestamp_custom('%H', true)) | int %}
              {% set f = hf_dach(md, h) | float(1) %}
              {% if ns.prev_t >= now_ts %}
                {% set ns.rem = ns.rem + delta * f %}
              {% elif t > now_ts %}
                {% set ns.rem = ns.rem + delta * f * ((t - now_ts) / (t - ns.prev_t)) %}
              {% endif %}
            {% endif %}
            {% set ns.prev_t = t %}{% set ns.prev_v = v %}
          {% endfor %}
          {% set ns.prev_t = 0 %}{% set ns.prev_v = 0 %}
          {% for ts, val in fassade.items() if ts.startswith(today) %}
            {% set t = as_timestamp(ts ~ tz) %}
            {% set v = val | float(0) %}
            {% if ns.prev_t != 0 %}
              {% set delta = [v - ns.prev_v, 0] | max %}
              {% set h = (((ns.prev_t + t) / 2) | timestamp_custom('%H', true)) | int %}
              {% set f = hf_fassade(md, h) | float(1) %}
              {% if ns.prev_t >= now_ts %}
                {% set ns.rem = ns.rem + delta * f %}
              {% elif t > now_ts %}
                {% set ns.rem = ns.rem + delta * f * ((t - now_ts) / (t - ns.prev_t)) %}
              {% endif %}
            {% endif %}
            {% set ns.prev_t = t %}{% set ns.prev_v = v %}
          {% endfor %}
          {{ (ns.rem / 1000) | round(1) }}
        {% else %}
          {{ states('sensor.pv_forecast_forecastsolar_all') | float(0) }}
        {% endif %}

      om_today: >-
        {% from 'horizon_dach.jinja' import horizon_factor_ts as hf_ts_dach %}
        {% from 'horizon_fassade.jinja' import horizon_factor_ts as hf_ts_fassade %}
        {% set dach = state_attr('sensor.pv_roof_openmeteo_production_today', 'wh_period') %}
        {% set fassade = state_attr('sensor.pv_fassade_openmeteo_production_today', 'wh_period') %}
        {% if dach is mapping and fassade is mapping %}
          {% set ns = namespace(total=0) %}
          {% set now_dt = now() %}
          {% set today = now_dt.strftime('%Y-%m-%d') %}
          {% set current_hour_ts = now_dt.replace(minute=0, second=0, microsecond=0).timestamp() %}
          {% set fraction_left = (3600 - (now_dt.minute * 60 + now_dt.second)) / 3600 %}
          {% for ts, d_val in dach.items() if ts.startswith(today) %}
            {% set t = as_timestamp(ts) %}
            {% set f_val = fassade[ts] | float(0) if ts in fassade else 0 %}
            {% set combined_wh = ((d_val | float(0)) * (hf_ts_dach(ts) | float(1))) + (f_val * (hf_ts_fassade(ts) | float(1))) %}
            {% if t == current_hour_ts %}{% set ns.total = ns.total + (combined_wh * fraction_left) %}
            {% elif t > current_hour_ts %}{% set ns.total = ns.total + combined_wh %}{% endif %}
          {% endfor %}
          {{ (ns.total / 1000) | round(1) }}
        {% else %}
          {{ states('sensor.pv_forecast_openmeteo_all') | float(0) }}
        {% endif %}

      dw_today: >-
        {% from 'horizon_dach.jinja' import horizon_factor_ts as hf_ts_dach %}
        {% from 'horizon_fassade.jinja' import horizon_factor_ts as hf_ts_fassade %}
        {% set dach = state_attr('sensor.pv_roof_dwd_production_today', 'wh_period') %}
        {% set fassade = state_attr('sensor.pv_fassade_dwd_production_today', 'wh_period') %}
        {% if dach is mapping and fassade is mapping %}
          {% set ns = namespace(total=0) %}
          {% set now_dt = now() %}
          {% set today = now_dt.strftime('%Y-%m-%d') %}
          {% set current_hour_ts = now_dt.replace(minute=0, second=0, microsecond=0).timestamp() %}
          {% set fraction_left = (3600 - (now_dt.minute * 60 + now_dt.second)) / 3600 %}
          {% for ts, d_val in dach.items() if ts.startswith(today) %}
            {% set t = as_timestamp(ts) %}
            {% set f_val = fassade[ts] | float(0) if ts in fassade else 0 %}
            {% set combined_wh = ((d_val | float(0)) * (hf_ts_dach(ts) | float(1))) + (f_val * (hf_ts_fassade(ts) | float(1))) %}
            {% if t == current_hour_ts %}{% set ns.total = ns.total + (combined_wh * fraction_left) %}
            {% elif t > current_hour_ts %}{% set ns.total = ns.total + combined_wh %}{% endif %}
          {% endfor %}
          {{ (ns.total / 1000) | round(1) }}
        {% else %}
          {{ states('sensor.pv_forecast_dwd_all') | float(0) }}
        {% endif %}

      # ------------------------------------------------------------------
      # Nowcast nur fuer die naechsten Stunden (2026-11-16)
      #
      # Der Korrekturfaktor aus pv_forecast_nowcast.yaml wirkte bisher auf den
      # GANZEN Resttag - eine Wolke um 10 Uhr kuerzte auch den Nachmittag.
      # Jetzt wird er ausgeblendet: aktuelle Stunde voll, danach linear bis 0
      # nach nowcast_stunden Stunden (bei 3: 1 - 2/3 - 1/3 - 0).
      #
      # nowcast_share = gewichteter Anteil dieser Stunden an der Restenergie
      # heute (Profil aus OpenMeteo, gleiche Horizontfaktoren wie om_today).
      # Wirksamer Faktor auf den Resttag: 1 + (Faktor - 1) * nowcast_share.
      # Ohne OpenMeteo-Profil 1.0 -> Verhalten wie frueher (ganzer Resttag).
      # ------------------------------------------------------------------
      nowcast_stunden: 3
      nowcast_share: >-
        {% from 'horizon_dach.jinja' import horizon_factor_ts as hf_ts_dach %}
        {% from 'horizon_fassade.jinja' import horizon_factor_ts as hf_ts_fassade %}
        {% set dach = state_attr('sensor.pv_roof_openmeteo_production_today', 'wh_period') %}
        {% set fassade = state_attr('sensor.pv_fassade_openmeteo_production_today', 'wh_period') %}
        {% set n_h = [nowcast_stunden | float(3), 1] | max %}
        {% if dach is mapping and fassade is mapping %}
          {% set now_dt = now() %}
          {% set today = now_dt.strftime('%Y-%m-%d') %}
          {% set cur = now_dt.replace(minute=0, second=0, microsecond=0).timestamp() %}
          {% set fraction_left = (3600 - (now_dt.minute * 60 + now_dt.second)) / 3600 %}
          {% set ns = namespace(alle=0, nah=0) %}
          {% for ts, d_val in dach.items() if ts.startswith(today) %}
            {% set t = as_timestamp(ts) %}
            {% if t >= cur %}
              {% set f_val = fassade[ts] | float(0) if ts in fassade else 0 %}
              {% set wh = ((d_val | float(0)) * (hf_ts_dach(ts) | float(1))) + (f_val * (hf_ts_fassade(ts) | float(1))) %}
              {% set k = ((t - cur) / 3600) | round(0) | int %}
              {% if k == 0 %}{% set wh = wh * fraction_left %}{% endif %}
              {% set ns.alle = ns.alle + wh %}
              {% set ns.nah = ns.nah + wh * ([1 - k / n_h, 0] | max) %}
            {% endif %}
          {% endfor %}
          {{ (ns.nah / ns.alle) | round(3) if ns.alle > 0 else 1 }}
        {% else %}
          1
        {% endif %}

      sc_tomorrow: >-
        {% set val = states('sensor.solcast_pv_forecast_prognose_morgen') %}
        {{ val | float if is_number(val) else states('sensor.pv_forecast_solcast_tomorrow') | float(0) }}

      fs_tomorrow: >-
        {% from 'horizon_dach.jinja' import horizon_factor as hf_dach %}
        {% from 'horizon_fassade.jinja' import horizon_factor as hf_fassade %}
        {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
        {% set md = (now() + timedelta(days=1)).strftime('%m-%d') %}
        {% set dach = state_attr('sensor.forecastsolar_api_raw_dach_stable', 'result') %}
        {% set fassade = state_attr('sensor.forecastsolar_api_raw_fassade_stable', 'result') %}
        {% if dach is mapping and fassade is mapping %}
          {% set tomorrow_suffix = tomorrow ~ ' ' %}
          {% set tz = now().strftime('%z') %}
          {% set ns = namespace(prev_t=0, prev_v=0, total=0) %}
          {% for ts, val in dach.items() if ts.startswith(tomorrow_suffix) %}
            {% set t = as_timestamp(ts ~ tz) %}
            {% set v = val | float(0) %}
            {% if ns.prev_t != 0 %}
              {% set h = (((ns.prev_t + t) / 2) | timestamp_custom('%H', true)) | int %}
              {% set ns.total = ns.total + ([v - ns.prev_v, 0] | max) * (hf_dach(md, h) | float(1)) %}
            {% endif %}
            {% set ns.prev_t = t %}{% set ns.prev_v = v %}
          {% endfor %}
          {% set ns.prev_t = 0 %}{% set ns.prev_v = 0 %}
          {% for ts, val in fassade.items() if ts.startswith(tomorrow_suffix) %}
            {% set t = as_timestamp(ts ~ tz) %}
            {% set v = val | float(0) %}
            {% if ns.prev_t != 0 %}
              {% set h = (((ns.prev_t + t) / 2) | timestamp_custom('%H', true)) | int %}
              {% set ns.total = ns.total + ([v - ns.prev_v, 0] | max) * (hf_fassade(md, h) | float(1)) %}
            {% endif %}
            {% set ns.prev_t = t %}{% set ns.prev_v = v %}
          {% endfor %}
          {{ (ns.total / 1000) | round(2) }}
        {% else %}
          0.0
        {% endif %}

      # ------------------------------------------------------------------
      # Morgen / Uebermorgen fuer OpenMeteo und DWD MIT Horizontfaktoren
      # (FIX 2026-11-16). Vorher rohe Tagessummen, waehrend om/dw/fs_today
      # und fs_tomorrow horizontkorrigiert sind - im Winter lagen morgen und
      # uebermorgen damit systematisch zu hoch, 131/133 kamen zu spaet und die
      # Preissteuerung sah zu wenig Unterdeckung. Der Bias lernt an "heute"
      # und gleicht das nicht aus.
      #
      # Quelle je Tag: wh_period des Tages-Sensors (_tomorrow/_day_after);
      # hat der keins, wh_period des _today-Sensors mit Datumsfilter; findet
      # sich fuer den Tag kein einziger Stundenwert, die rohe Summe wie bisher.
      # Reihenfolge: om_tomorrow, dw_tomorrow, om_day_after, dw_day_after
      # ------------------------------------------------------------------
      fern_tage: >-
        {% from 'horizon_dach.jinja' import horizon_factor_ts as hf_d %}
        {% from 'horizon_fassade.jinja' import horizon_factor_ts as hf_f %}
        {% set ns = namespace(out=[]) %}
        {% for src, sfx, off in [('openmeteo', 'tomorrow', 1), ('dwd', 'tomorrow', 1),
                                 ('openmeteo', 'day_after', 2), ('dwd', 'day_after', 2)] %}
          {% set tag = (now() + timedelta(days=off)).strftime('%Y-%m-%d') %}
          {% set e_d = 'sensor.pv_roof_' ~ src ~ '_production_' ~ sfx %}
          {% set e_f = 'sensor.pv_fassade_' ~ src ~ '_production_' ~ sfx %}
          {% set d = state_attr(e_d, 'wh_period') %}
          {% set f = state_attr(e_f, 'wh_period') %}
          {% if not (d is mapping and f is mapping) %}
            {% set d = state_attr('sensor.pv_roof_' ~ src ~ '_production_today', 'wh_period') %}
            {% set f = state_attr('sensor.pv_fassade_' ~ src ~ '_production_today', 'wh_period') %}
          {% endif %}
          {% set nt = namespace(sum=0, n=0) %}
          {% if d is mapping and f is mapping %}
            {% for ts, dv in d.items() if ts.startswith(tag) %}
              {% set fv = f[ts] | float(0) if ts in f else 0 %}
              {% set nt.sum = nt.sum + (dv | float(0)) * (hf_d(ts) | float(1)) + fv * (hf_f(ts) | float(1)) %}
              {% set nt.n = nt.n + 1 %}
            {% endfor %}
          {% endif %}
          {% if nt.n > 0 %}
            {% set ns.out = ns.out + [(nt.sum / 1000) | round(2)] %}
          {% else %}
            {% set ns.out = ns.out + [((states(e_d) | float(0)) + (states(e_f) | float(0))) | round(2)] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}

      om_tomorrow: "{{ (fern_tage[0] if fern_tage is list and fern_tage | count == 4 else 0) | float(0) }}"
      dw_tomorrow: "{{ (fern_tage[1] if fern_tage is list and fern_tage | count == 4 else 0) | float(0) }}"
      om_day_after: "{{ (fern_tage[2] if fern_tage is list and fern_tage | count == 4 else 0) | float(0) }}"
      dw_day_after: "{{ (fern_tage[3] if fern_tage is list and fern_tage | count == 4 else 0) | float(0) }}"

    sensor:
      - name: "PV Forecast Forecastsolar all"
        unique_id: pv_forecast_forecastsolar_all
        unit_of_measurement: "kWh"
        state: "{{ fs_today }}"

      - name: "PV Forecast openmeteo all"
        unique_id: pv_forecast_openmeteo_all
        unit_of_measurement: "kWh"
        state: "{{ om_today }}"

      - name: "PV Forecast DWD all"
        unique_id: pv_forecast_dwd_all
        unit_of_measurement: "kWh"
        state: "{{ dw_today }}"

      - name: "PV Forecast Solcast Tomorrow"
        unique_id: pv_forecast_solcast_tomorrow
        unit_of_measurement: "kWh"
        state: "{{ sc_tomorrow }}"

      - name: "PV Forecast ForecastSolar Tomorrow"
        unique_id: pv_forecast_forecastsolar_tomorrow
        unit_of_measurement: "kWh"
        state: "{{ fs_tomorrow }}"

      - name: "PV Forecast Openmeteo Tomorrow"
        unique_id: pv_forecast_openmeteo_tomorrow
        unit_of_measurement: "kWh"
        state: "{{ om_tomorrow }}"

      - name: "PV Forecast DWD tomorrow"
        unique_id: pv_forecast_dwd_tomorrow
        unit_of_measurement: "kWh"
        state: "{{ dw_tomorrow }}"

      - name: "PV Forecast OpenMeteo Day After"
        unique_id: pv_forecast_openmeteo_day_after
        unit_of_measurement: "kWh"
        state: "{{ om_day_after }}"

      - name: "PV Forecast DWD Day After"
        unique_id: pv_forecast_dwd_day_after
        unit_of_measurement: "kWh"
        state: "{{ dw_day_after }}"

      - name: "PV Forecast Weighted"
        unique_id: pv_forecast_weighted
        unit_of_measurement: "kWh"
        state: >-
          {% set sc = sc_today | float(0) %}
          {% set fs = fs_today | float(0) %}
          {% set om = om_today | float(0) %}
          {% set dw = dw_today | float(0) %}
          {% set sc_w = bw_sc if sc > 0 else 0 %}
          {% set fs_w = bw_fs if fs > 0 else 0 %}
          {% set om_w = bw_om if om > 0 else 0 %}
          {% set dw_w = bw_dw if dw > 0 else 0 %}
          {% set total_weight = sc_w + fs_w + om_w + dw_w %}
          {% if total_weight > 0 %}
            {# total_correction (Hoehe x Albedo) wird bewusst NICHT multipliziert:
               zusammen mit dem gelernten Bias konnte die Gesamtkorrektur im
               Winter nie unter ~1.04 fallen, selbst wenn 1.0 richtig gewesen
               waere. Der Bias allein deckt das ab, sensor.pv_total_correction_factor
               bleibt nur zur Diagnose erhalten. #}
            {# Live-Nowcast-Korrektur aus gemessener Einstrahlung, siehe
               pv_forecast_nowcast.yaml. Nur fuer HEUTE relevant - vor
               Sonnenaufgang/bei zu wenig Signal ist der Faktor 1.0 (neutral).
               Der Morgen-Snapshot (und damit die Bias-Lernschleife) liest das
               Attribut ohne_nowcast, sieht den Faktor also nie.
               Seit 2026-11-16 nur auf den nahen Teil des Resttags
               (nowcast_share, siehe variables). #}
            {% set nowcast = states('sensor.pv_nowcast_correction_factor') | float(1) %}
            {% set nf = 1 + (nowcast - 1) * (nowcast_share | float(1)) %}
            {{ ((sc_w * sc + fs_w * fs + om_w * om + dw_w * dw) / total_weight * bias * nf) | round(1) }}
          {% elif is_state('sun.sun', 'below_horizon') and not state_attr('sun.sun', 'rising') %}
            0.0
          {% else %}
            {{ this.state | float(0) }}
          {% endif %}
        attributes:
          # Gleiche Gewichtung OHNE Nowcast-Faktor (2026-11). Liest der
          # Morgen-Snapshot in pv_forecast_automations.yaml: der laeuft erst
          # nach Sonnenaufgang, wenn der Nowcast schon wirkt, und das
          # Bias-Lernen soll ihn nicht sehen.
          ohne_nowcast: >-
            {% set sc = sc_today | float(0) %}
            {% set fs = fs_today | float(0) %}
            {% set om = om_today | float(0) %}
            {% set dw = dw_today | float(0) %}
            {% set sc_w = bw_sc if sc > 0 else 0 %}
            {% set fs_w = bw_fs if fs > 0 else 0 %}
            {% set om_w = bw_om if om > 0 else 0 %}
            {% set dw_w = bw_dw if dw > 0 else 0 %}
            {% set total_weight = sc_w + fs_w + om_w + dw_w %}
            {{ ((sc_w * sc + fs_w * fs + om_w * om + dw_w * dw) / total_weight * bias) | round(2)
               if total_weight > 0 else 0 }}
          # Diagnose Nowcast (2026-11-16): tatsaechlich auf den Resttag
          # angewandter Faktor und Anteil der naechsten Stunden an der
          # Restenergie.
          nowcast_wirksam: >-
            {% set nowcast = states('sensor.pv_nowcast_correction_factor') | float(1) %}
            {{ (1 + (nowcast - 1) * (nowcast_share | float(1))) | round(3) }}
          nowcast_anteil: "{{ nowcast_share | float(1) | round(3) }}"

      - name: "PV Forecast Weighted Tomorrow"
        unique_id: pv_forecast_weighted_tomorrow
        unit_of_measurement: "kWh"
        state: >-
          {% set sc = sc_tomorrow | float(0) %}
          {% set fs = fs_tomorrow | float(0) %}
          {% set om = om_tomorrow | float(0) %}
          {% set dw = dw_tomorrow | float(0) %}
          {% set sc_w = bw_sc if sc > 0 else 0 %}
          {% set fs_w = bw_fs if fs > 0 else 0 %}
          {% set om_w = bw_om if om > 0 else 0 %}
          {% set dw_w = bw_dw if dw > 0 else 0 %}
          {% set total_weight = sc_w + fs_w + om_w + dw_w %}
          {% if total_weight > 0 %}
            {{ ((sc_w * sc + fs_w * fs + om_w * om + dw_w * dw) / total_weight * bias) | round(2) }}
          {% else %}
            0.0
          {% endif %}

      - name: "PV Forecast Weighted Day After"
        unique_id: pv_forecast_weighted_day_after
        unit_of_measurement: "kWh"
        state: >-
          {% set om = om_day_after | float(0) %}
          {% set dw = dw_day_after | float(0) %}
          {% set om_w = bw_om if om > 0 else 0 %}
          {% set dw_w = bw_dw if dw > 0 else 0 %}
          {% set total_weight = om_w + dw_w %}
          {% if total_weight > 0 %}
            {{ ((om_w * om + dw_w * dw ) / total_weight * bias) | round(2) }}
          {% else %}
            0.0
          {% endif %}
