################################################################################
# EV SoC-Tracking (persistent, zustandslos berechnet)
#
# SoC = Anker-SoC + (Wallbox-Zaehler - Anker-Zaehlerstand) * eff / Kapazitaet
# Anker wird NUR geschrieben bei: BLE-Kalibrierung, Fahrzeugwechsel.
# Waehrend des Ladens laeuft keine Automation -> kein Aufschaukeln moeglich.
################################################################################

input_number:
  zero_sr_soc_anchor:
    name: "Zero SOC Anker"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:motorbike-electric

  zero_sr_anchor_meter_kwh:
    name: "Zero Anker-Zaehlerstand"
    min: 0
    max: 1000000
    step: 0.001
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:counter

  honda_e_soc_anchor:
    name: "Honda e SOC Anker"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:car-electric

  honda_e_anchor_meter_kwh:
    name: "Honda e Anker-Zaehlerstand"
    min: 0
    max: 1000000
    step: 0.001
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:counter

input_datetime:
  zero_sr_last_calibration:
    name: "Zero SOC letzte Kalibrierung"
    has_date: true
    has_time: true

  honda_e_last_calibration:
    name: "Honda e SOC letzte Kalibrierung"
    has_date: true
    has_time: true

################################################################################
# Sichtbare Sensoren - reine Funktion der Helper, kein eigener Zustand
################################################################################

template:
  - sensor:
      - name: "Zero SOC"
        unique_id: zero_sr_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >-
          {% set anchor = states('input_number.zero_sr_soc_anchor') | float(0) %}
          {% set a_kwh  = states('input_number.zero_sr_anchor_meter_kwh') | float(-1) %}
          {% set meter  = states('sensor.warp3_2ita_energyabs') | float(-1) %}
          {% set cap    = state_attr('sensor.global_parameter', 'zero_capacity') | float(0) %}
          {% set eff    = state_attr('sensor.global_parameter', 'zero_charge_efficiency') | float(0.88) %}
          {% set active = is_state('input_select.ev_vehicle_mode', 'zero') %}
          {% if active and a_kwh >= 0 and meter > a_kwh and cap > 0 %}
            {{ [ anchor + (meter - a_kwh) * eff / cap * 100, 100 ] | min | round(1) }}
          {% else %}
            {{ anchor | round(1) }}
          {% endif %}
        availability: "{{ has_value('input_number.zero_sr_soc_anchor') }}"
        attributes:
          last_calibration: "{{ states('input_datetime.zero_sr_last_calibration') }}"
          kwh_since_anchor: >-
            {% set a_kwh = states('input_number.zero_sr_anchor_meter_kwh') | float(-1) %}
            {% set meter = states('sensor.warp3_2ita_energyabs') | float(-1) %}
            {{ [meter - a_kwh, 0] | max | round(3) if (a_kwh >= 0 and meter >= 0) else 0 }}
          tracking: "{{ is_state('input_select.ev_vehicle_mode', 'zero') }}"

      - name: "Honda e SOC"
        unique_id: honda_e_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >-
          {% set anchor = states('input_number.honda_e_soc_anchor') | float(0) %}
          {% set a_kwh  = states('input_number.honda_e_anchor_meter_kwh') | float(-1) %}
          {% set meter  = states('sensor.warp3_2ita_energyabs') | float(-1) %}
          {% set cap    = state_attr('sensor.global_parameter', 'honda_e_capacity') | float(0) %}
          {% set eff    = state_attr('sensor.global_parameter', 'honda_e_charge_efficiency') | float(0.88) %}
          {% set active = is_state('input_select.ev_vehicle_mode', 'honda_e') %}
          {% if active and a_kwh >= 0 and meter > a_kwh and cap > 0 %}
            {{ [ anchor + (meter - a_kwh) * eff / cap * 100, 100 ] | min | round(1) }}
          {% else %}
            {{ anchor | round(1) }}
          {% endif %}
        availability: "{{ has_value('input_number.honda_e_soc_anchor') }}"
        attributes:
          last_calibration: "{{ states('input_datetime.honda_e_last_calibration') }}"
          kwh_since_anchor: >-
            {% set a_kwh = states('input_number.honda_e_anchor_meter_kwh') | float(-1) %}
            {% set meter = states('sensor.warp3_2ita_energyabs') | float(-1) %}
            {{ [meter - a_kwh, 0] | max | round(3) if (a_kwh >= 0 and meter >= 0) else 0 }}
          tracking: "{{ is_state('input_select.ev_vehicle_mode', 'honda_e') }}"

################################################################################
# Automationen - schreiben nur Anker, nie den laufenden Wert
################################################################################

automation:
  # ----------------------------------------------------------
  # 1. Kalibrierung Zero (neuer BLE-Wert)
  # ----------------------------------------------------------
  - id: zero_sr_soc_kalibrierung
    alias: "Zero SOC - Kalibrierung per BLE"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.zero_sr_batteriestand
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state is not none
             and trigger.to_state.state | regex_replace('[^0-9.-]', '') | float(-1) > 0 }}
    action:
      - variables:
          raw_soc: >-
            {{ trigger.to_state.state | regex_replace('[^0-9.-]', '') | float(0) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.zero_sr_soc_anchor
        data:
          value: "{{ [[raw_soc, 0] | max, 100] | min | round(1) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.zero_sr_anchor_meter_kwh
        data:
          value: "{{ [states('sensor.warp3_2ita_energyabs') | float(0), 0] | max | round(3) }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.zero_sr_last_calibration
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ----------------------------------------------------------
  # 2. Kalibrierung Honda e (neuer BLE-Wert)
  # ----------------------------------------------------------
  - id: honda_e_soc_kalibrierung
    alias: "Honda e SOC - Kalibrierung per BLE"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.honda_e_batteriestand
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state is not none
             and trigger.to_state.state | regex_replace('[^0-9.-]', '') | float(-1) > 0 }}
    action:
      - variables:
          raw_soc: >-
            {{ trigger.to_state.state | regex_replace('[^0-9.-]', '') | float(0) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.honda_e_soc_anchor
        data:
          value: "{{ [[raw_soc, 0] | max, 100] | min | round(1) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.honda_e_anchor_meter_kwh
        data:
          value: "{{ [states('sensor.warp3_2ita_energyabs') | float(0), 0] | max | round(3) }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.honda_e_last_calibration
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ----------------------------------------------------------
  # 3. Fahrzeugwechsel: erreichten Stand des alten Fahrzeugs einfrieren,
  #    Anker des neuen Fahrzeugs auf aktuellen Zaehlerstand setzen.
  #    Rechnet selbst mit trigger.from_state -> kein Race mit dem Sensor.
  # ----------------------------------------------------------
  - id: ev_soc_fahrzeugwechsel
    alias: "EV SOC - Anker bei Fahrzeugwechsel"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.ev_vehicle_mode
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.to_state is not none }}"
    variables:
      meter: "{{ states('sensor.warp3_2ita_energyabs') | float(-1) }}"
      old_mode: "{{ trigger.from_state.state }}"
      new_mode: "{{ trigger.to_state.state }}"
    action:
      # -- altes Fahrzeug einfrieren
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ old_mode == 'zero' and meter >= 0 }}"
            sequence:
              - variables:
                  a_soc: "{{ states('input_number.zero_sr_soc_anchor') | float(0) }}"
                  a_kwh: "{{ states('input_number.zero_sr_anchor_meter_kwh') | float(-1) }}"
                  cap: "{{ state_attr('sensor.global_parameter', 'zero_capacity') | float(0) }}"
                  eff: "{{ state_attr('sensor.global_parameter', 'zero_charge_efficiency') | float(0.88) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.zero_sr_soc_anchor
                data:
                  value: >-
                    {% if a_kwh >= 0 and meter > a_kwh and cap > 0 %}
                      {{ [ a_soc + (meter - a_kwh) * eff / cap * 100, 100 ] | min | round(1) }}
                    {% else %}
                      {{ a_soc | round(1) }}
                    {% endif %}
          - conditions:
              - condition: template
                value_template: "{{ old_mode == 'honda_e' and meter >= 0 }}"
            sequence:
              - variables:
                  a_soc: "{{ states('input_number.honda_e_soc_anchor') | float(0) }}"
                  a_kwh: "{{ states('input_number.honda_e_anchor_meter_kwh') | float(-1) }}"
                  cap: "{{ state_attr('sensor.global_parameter', 'honda_e_capacity') | float(0) }}"
                  eff: "{{ state_attr('sensor.global_parameter', 'honda_e_charge_efficiency') | float(0.88) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.honda_e_soc_anchor
                data:
                  value: >-
                    {% if a_kwh >= 0 and meter > a_kwh and cap > 0 %}
                      {{ [ a_soc + (meter - a_kwh) * eff / cap * 100, 100 ] | min | round(1) }}
                    {% else %}
                      {{ a_soc | round(1) }}
                    {% endif %}
      # -- Anker-Zaehlerstand beider Fahrzeuge auf jetzt setzen
      - condition: template
        value_template: "{{ meter >= 0 }}"
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.zero_sr_anchor_meter_kwh
            - input_number.honda_e_anchor_meter_kwh
        data:
          value: "{{ meter | round(3) }}"
