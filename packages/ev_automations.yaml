# ============================================================
# PV surplus wallbox charging (WARP3) - Automations
# ============================================================

automation:
  # ============================================================
  # SESSION RESET: zero the session counter when the cable is plugged in.
  # ============================================================
  - alias: "Wallbox: Reset session energy on cable plug-in"
    id: wallbox_reset_session_energy
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_cable
        from: "off"
        to: "on"
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.warp3_2ita_energyabs')
            not in ['unknown', 'unavailable', 'none', None] }}
    actions:
      # Snapshot the absolute meter -> ev_session_energy becomes 0.
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_session_start_energy_kwh
        data:
          value: "{{ states('sensor.warp3_2ita_energyabs') | float(0) }}"
      - action: logbook.log
        data:
          name: "Wallbox"
          message: "Cable plugged in -- session energy counter reset to 0."

  # ============================================================
  # ENFORCE OFF: vehicle mode "off" must never charge.
  # Catches every entry point, including WARP3 firmware auto-start
  # on cable plug-in (which bypasses the HA start automations).
  # ============================================================
  - alias: "Wallbox: Enforce OFF mode (never charge when vehicle = off)"
    id: wallbox_enforce_off
    mode: single
    triggers:
      # Vehicle mode switched to off.
      - trigger: state
        entity_id: input_select.ev_vehicle_mode
        to: "off"
      # Charging started for ANY reason (e.g. wallbox auto-start).
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_charging
        to: "on"
      # Cable plugged in while already in off mode.
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_cable
        to: "on"
    conditions:
      - condition: state
        entity_id: input_select.ev_vehicle_mode
        state: "off"
    actions:
      # Block delivery (0 A) so the wallbox cannot re-deliver power...
      - action: number.set_value
        target:
          entity_id: number.warp3_2ita_globalcurrent
        data:
          value: 0
      # ...and explicitly stop the session.
      - action: button.press
        target:
          entity_id: button.warp3_2ita_stopcharge
      - action: logbook.log
        data:
          name: "Wallbox"
          message: "Vehicle mode = off -- charging blocked and stopped."

  # ============================================================
  # MANUAL: fixed-current charging (overrides every strategy).
  # Active whenever ev_manual_charging_current >= 6 A and vehicle != off.
  # ============================================================
  - alias: "Wallbox: Manual fixed-current charging"
    id: wallbox_manual_charge
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.ev_manual_charging_current
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_cable
        to: "on"
      # Re-evaluate when the energy target is changed (vehicle/percent).
      - trigger: state
        entity_id: input_select.ev_vehicle_mode
      - trigger: state
        entity_id: input_number.ev_charge_by_percent
      # Nachzuegler nach Reload/Neustart - siehe wallbox_universal_start.
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: binary_sensor.warp3_2ita_cable
        state: "on"
      - condition: numeric_state
        entity_id: input_number.ev_manual_charging_current
        above: 5 # >= 6 A => manual mode active
      # Block when vehicle mode is off.
      - condition: template
        value_template: "{{ not is_state('input_select.ev_vehicle_mode', 'off') }}"
      # Do not (re)start once the per-session energy limit is reached.
      # Ausnahme Zielzeit-Modus: dort ist der Live-SoC die Wahrheit, nicht
      # die Session-Energie (gleiche Begruendung wie in
      # wallbox_stop_on_limit_or_off). ev_max_charge_energy haengt ueber
      # ev_charge_by_percent am SoC beim Anstecken - nach einer
      # BLE-Nachkalibrierung driftet es weg und die Ladung liesse sich
      # nicht mehr starten, obwohl der Ziel-SoC noch fehlt.
      #
      # Ausnahme Ladeziel 100 %: dann gibt es keine berechnete Obergrenze
      # mehr, die Ladung laeuft bis Fahrzeug/Wallbox selbst abschalten.
      # Ohne diese Ausnahme koennte nach einer PV-Pause nicht mehr
      # gestartet werden, sobald die (ungenaue) Energiegrenze einmal
      # erreicht wurde.
      - condition: template
        value_template: >-
          {{ is_state('input_select.ev_charge_mode', 'target_time')
             or states('input_number.ev_charge_to_percent') | float(0) >= 100
             or states('sensor.ev_session_energy') | float(0)
                < states('sensor.ev_max_charge_energy') | float(0) }}
    variables:
      # Deckel auf wallbox_max_amps: der Slider laesst bis 32 A zu.
      manual_amps: >-
        {{ [ states('input_number.ev_manual_charging_current') | int(0),
             state_attr('sensor.global_parameter', 'wallbox_max_amps') | int(16) ] | min }}
      current_amps: "{{ states('number.warp3_2ita_globalcurrent') | int(0) }}"
      is_charging: "{{ is_state('binary_sensor.warp3_2ita_charging', 'on') }}"
    actions:
      # Apply the manual current if it differs from the current target.
      - if:
          - "{{ manual_amps != current_amps }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.warp3_2ita_globalcurrent
            data:
              value: "{{ manual_amps }}"
      # Start the wallbox if it is not already charging.
      - if:
          - "{{ not is_charging }}"
        then:
          - delay:
              milliseconds: 500
          - action: button.press
            target:
              entity_id: button.warp3_2ita_startcharge
          - action: logbook.log
            data:
              name: "Wallbox"
              message: "Manual charging started at {{ manual_amps }} A."

  # ============================================================
  # UNIVERSAL START: Starts charging immediately on user interaction
  # or after 15 seconds of sustained automatic PV surplus.
  # ============================================================
  - alias: "Wallbox: Start charging (Universal)"
    id: wallbox_universal_start
    mode: single
    triggers:
      # 1. Automatic start: target current is sufficient for 15 seconds
      - trigger: numeric_state
        entity_id: sensor.ev_target_charging_current
        above: 5
        for:
          seconds: 15
      # 2. Instant start: user switches the vehicle mode on
      - trigger: state
        entity_id: input_select.ev_vehicle_mode
      # 3. Instant start: user changes the charging mode
      - trigger: state
        entity_id: input_select.ev_charge_mode
      # 4. Instant start: user plugs in the cable
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_cable
        to: "on"
      # 5. Nachzuegler. Der numeric_state-Trigger oben loest nur beim
      # UEBERSCHREITEN von 5 A aus - nach einem YAML-Reload, einem
      # Neustart oder einem fehlgeschlagenen Startversuch steht der
      # Sollstrom aber meist schon oben, und es kommt nie wieder ein
      # Uebergang. Ohne diesen Takt bleibt die Wallbox dann stehen, bis
      # der Sollstrom zufaellig einmal unter 6 A faellt und wieder steigt.
      # Alle Bedingungen unten werden bei jedem Lauf ohnehin geprueft.
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      # Cable must be connected
      - condition: state
        entity_id: binary_sensor.warp3_2ita_cable
        state: "on"
      # Wallbox must not be already charging
      - condition: state
        entity_id: binary_sensor.warp3_2ita_charging
        state: "off"
      # Skip if manual charging is active (handled by manual automation)
      - condition: numeric_state
        entity_id: input_number.ev_manual_charging_current
        below: 6
      # Vehicle mode must not be 'off'
      - condition: template
        value_template: "{{ not is_state('input_select.ev_vehicle_mode', 'off') }}"
      # There must actually be a valid target current calculated (> 5 A)
      - condition: numeric_state
        entity_id: sensor.ev_target_charging_current
        above: 5
      # Target energy limit has not been reached yet.
      # Zielzeit-Modus ausgenommen - siehe wallbox_manual_charge.
      # Ladeziel 100 % ebenfalls ausgenommen: dort gibt es keine
      # Energiegrenze, die Ladung laeuft bis Fahrzeug/Wallbox abschalten.
      - condition: template
        value_template: >-
          {{ is_state('input_select.ev_charge_mode', 'target_time')
             or states('input_number.ev_charge_to_percent') | float(0) >= 100
             or states('sensor.ev_session_energy') | float(0) < states('sensor.ev_max_charge_energy') | float(0) }}
    actions:
      # 1. Wait a moment to let the target sensor calculate the correct current after triggers
      - delay:
          seconds: 2
      # 2. Set the target current (ensuring we force float to int correctly)
      - action: number.set_value
        target:
          entity_id: number.warp3_2ita_globalcurrent
        data:
          value: "{{ states('sensor.ev_target_charging_current') | int(6) }}"
      # 3. Wait briefly for the wallbox to register the current limit
      - delay:
          milliseconds: 500
      # 4. Press start
      - action: button.press
        target:
          entity_id: button.warp3_2ita_startcharge
      - action: logbook.log
        data:
          name: "Wallbox"
          message: >-
            Charging started automatically in mode '{{ states('input_select.ev_charge_mode') }}'
            at {{ states('sensor.ev_target_charging_current') }} A.

  # ============================================================
  # TRACK: while charging, follow the target current (all strategies).
  # mode:single + hold lets the fast battery loop settle against a fixed EV draw
  # before the EV is allowed to step again (breaks the limit cycle).
  # Manual mode is handled by wallbox_manual_charge, so it is excluded here.
  # ============================================================
  - alias: "Wallbox: Track target while charging"
    id: wallbox_track_target
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.ev_target_charging_current
    conditions:
      - condition: state
        entity_id: binary_sensor.warp3_2ita_charging
        state: "on"
      - condition: numeric_state
        entity_id: sensor.ev_target_charging_current
        above: 5
      - condition: numeric_state
        entity_id: input_number.ev_manual_charging_current
        below: 6
    actions:
      - repeat:
          sequence:
            - variables:
                target_amps: "{{ states('sensor.ev_target_charging_current') | int(6) }}"
                current_amps: "{{ states('number.warp3_2ita_globalcurrent') | int(0) }}"
            - condition: template
              value_template: "{{ target_amps != current_amps }}"
            - action: number.set_value
              target:
                entity_id: number.warp3_2ita_globalcurrent
              data:
                value: "{{ target_amps }}"
            - delay:
                seconds: 45
          # Wiederholt die Schleife so lange, wie der Ist-Wert noch nicht dem aktuellen Target entspricht
          until:
            - condition: template
              value_template: "{{ states('sensor.ev_target_charging_current') | int(6) == states('number.warp3_2ita_globalcurrent') | int(0) }}"

  # ============================================================
  # STOP (idle): target current dropped below 6 A for 2 minutes.
  # Covers pv_surplus losing the sun and pv_battery_floor hitting the SOC floor.
  # pv_grid_floor never drops below 6 A, so it is unaffected here.
  # mode=off and the energy limit are handled by wallbox_stop_on_limit_or_off.
  # ============================================================
  - alias: "Wallbox: Stop when target idle"
    id: wallbox_stop_on_idle
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ev_target_charging_current
        below: 6
        for:
          minutes: 2
    conditions:
      - condition: state
        entity_id: binary_sensor.warp3_2ita_charging
        state: "on"
      # Do not stop manual fixed-current charging.
      - condition: numeric_state
        entity_id: input_number.ev_manual_charging_current
        below: 6
    actions:
      - action: button.press
        target:
          entity_id: button.warp3_2ita_stopcharge
      - action: logbook.log
        data:
          name: "Wallbox"
          message: "Charging stopped -- target current dropped to 0 A."

  # ============================================================
  # STOP (limit / off): stop when the energy target is reached or vehicle = off.
  # Applies to manual and automatic charging.
  # ============================================================
  - alias: "Wallbox: Stop charging at limit or when mode is off"
    id: wallbox_stop_on_limit_or_off
    mode: single
    triggers:
      # Session energy crosses the limit while charging.
      - trigger: template
        value_template: >-
          {{ states('sensor.ev_session_energy') | float(0)
            >= states('sensor.ev_max_charge_energy') | float(0) }}
      # Vehicle mode set to off.
      - trigger: state
        entity_id: input_select.ev_vehicle_mode
        to: "off"
      # Charging just started -> wait 5 seconds before checking to let template sensors update!
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_charging
        to: "on"
        for:
          seconds: 5
      # Limit changed (vehicle/percent edited)
      - trigger: state
        entity_id: sensor.ev_max_charge_energy
    conditions:
      - condition: state
        entity_id: binary_sensor.warp3_2ita_charging
        state: "on"
      # ONLY stop if vehicle is off OR (limit is reached AND limit is actually greater than 0)
      #
      # Ausnahme Zielzeit-Modus: dort ist der Live-SoC die Wahrheit, nicht die
      # Session-Energie. ev_max_charge_energy haengt ueber ev_charge_by_percent
      # am SoC beim Anstecken; sobald PV-Vorladung und Zwangsladung sich
      # abwechseln, driften die beiden Grenzen auseinander und diese Automation
      # wuerde kurz vor dem Ziel abschalten. Der Vehicle-off-Fall bleibt aktiv.
      #
      # Ausnahme Ladeziel 100 %: dann wird ueberhaupt nicht ueber die
      # Energiegrenze gestoppt - das Ende bestimmen Fahrzeug bzw. Wallbox.
      # Vehicle-off, wallbox_stop_on_idle und der Killswitch bleiben aktiv.
      - condition: template
        value_template: >-
          {{ is_state('input_select.ev_vehicle_mode', 'off')
            or ( not is_state('input_select.ev_charge_mode', 'target_time')
                  and states('input_number.ev_charge_to_percent') | float(0) < 100
                  and states('sensor.ev_max_charge_energy') | float(0) > 0
                  and states('sensor.ev_session_energy') | float(0)
                  >= states('sensor.ev_max_charge_energy') | float(0) ) }}
    actions:
      - action: button.press
        target:
          entity_id: button.warp3_2ita_stopcharge
      - action: logbook.log
        data:
          name: "Wallbox"
          message: >-
            Charging stopped -- vehicle={{ states('input_select.ev_vehicle_mode') }},
            session={{ states('sensor.ev_session_energy') }} kWh,
            limit={{ states('sensor.ev_max_charge_energy') }} kWh.

  # ============================================================
  # Slider correction: force the manual current to 0 or >= 6
  # (the wallbox cannot charge below 6 A).
  # ============================================================
  - alias: "Wallbox: Correct manual charging current"
    id: wallbox_correct_manual_current
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.ev_manual_charging_current
    conditions:
      - condition: numeric_state
        entity_id: input_number.ev_manual_charging_current
        above: 0
        below: 6
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_manual_charging_current
        data:
          value: 0

    # ============================================
    # reset vehicle to off, when unplugged
    # ============================================
  - alias: "Wallbox: reset vehicle"
    id: wallbox_reset_vehicle
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_cable
        from: "on"
        to: "off"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.ev_vehicle_mode
        data:
          option: "off"

    # ===================================================================
    # calculate charge energy delta, when target soc or vehicle changes
    #
    # Umgebaut: der Wert ist jetzt SELBSTKORRIGIEREND statt einmalig.
    # Gerechnet wird "Restbedarf + was in dieser Session schon geladen
    # wurde". Beides haengt am selben Wallbox-Zaehler, also bleibt das
    # Ergebnis waehrend einer laufenden Ladung rechnerisch konstant -
    # ein erneuter Lauf schreibt denselben Wert, es kann nichts
    # weglaufen. Aendert sich dagegen der Anker (BLE-Kalibrierung), zieht
    # der Wert sofort nach.
    #
    # Warum nicht einfach "Ziel - SoC": das wuerde waehrend des Ladens
    # schrumpfen, waehrend sensor.ev_session_energy waechst -
    # wallbox_stop_on_limit_or_off haette die Ladung dann weit vor dem
    # Ziel beendet. Mit dem Session-Anteil drin bedeutet
    # "session >= max" exakt "Ziel-SoC erreicht".
    #
    # Bei Ziel 100 % ist der Wert ohne Bedeutung - dort wird nicht mehr
    # ueber die Energiegrenze gestoppt.
    # ===================================================================
  - alias: "Wallbox: Lademenge (Delta) aus Ziel-SOC berechnen"
    id: wallbox_calc_charge_delta
    mode: restart
    triggers:
      # 1. Ziel-SOC geaendert
      - trigger: state
        entity_id: input_number.ev_charge_to_percent
      # 2. Fahrzeug gewechselt
      - trigger: state
        entity_id: input_select.ev_vehicle_mode
      # 3. Kabel gesteckt - wallbox_reset_session_energy hat den
      #    Session-Zaehler gerade genullt, danach neu rechnen
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_cable
        to: "on"
        for: "00:00:05"
      # 4. Fahrzeug-SoC hat sich geaendert und steht 10 s still
      #    (= BLE-Kalibrierung im Stand; waehrend des Ladens laeuft der
      #    Wert zu haeufig nach und der Trigger greift absichtlich nicht)
      - trigger: state
        entity_id:
          - sensor.zero_sr_soc
          - sensor.honda_e_soc
        for: "00:00:10"
      # 5. Nachzuegler: faengt den Fall ab, dass "Lade AUF" auf einen
      #    Wert gesetzt wird, den es schon hatte - dann gibt es keine
      #    Zustandsaenderung und damit keinen Trigger 1.
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      # Nur ausführen, wenn auch wirklich ein Fahrzeug aktiv ausgewählt ist
      - condition: template
        value_template: "{{ states('input_select.ev_vehicle_mode') in ['zero', 'honda_e'] }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_charge_by_percent
        data:
          value: >-
            {% set target = states('input_number.ev_charge_to_percent') | float(0) %}
            {% set vehicle = states('input_select.ev_vehicle_mode') %}

            {# Fahrzeugspezifische Kenndaten #}
            {% if vehicle == 'zero' %}
              {% set current_soc = states('sensor.zero_sr_soc') | float(0) %}
              {% set cap = state_attr('sensor.global_parameter', 'zero_sr_capacity') | float(0) %}
              {% set eff = state_attr('sensor.global_parameter', 'zero_sr_charge_efficiency') | float(0.9) %}
            {% elif vehicle == 'honda_e' %}
              {% set current_soc = states('sensor.honda_e_soc') | float(0) %}
              {% set cap = state_attr('sensor.global_parameter', 'honda_e_capacity') | float(0) %}
              {% set eff = state_attr('sensor.global_parameter', 'honda_e_charge_efficiency') | float(0.88) %}
            {% else %}
              {% set current_soc = 0 %}
              {% set cap = 0 %}
              {% set eff = 1 %}
            {% endif %}

            {# Noch fehlender Hub, nie negativ #}
            {% set rest = [0, target - current_soc] | max %}

            {# In DIESER Session bereits geladene Energie, in SoC-Prozent.
               Ohne diesen Anteil wuerde das Delta waehrend des Ladens
               schrumpfen und die Ladung viel zu frueh abbrechen. #}
            {% set done = ((states('sensor.ev_session_energy') | float(0)) * eff / cap * 100) if cap > 0 else 0 %}

            {{ [rest + done, 100] | min | round(1) }}

  - alias: "EV: Manuellen Ladestrom auf 0 zurücksetzen"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.warp3_2ita_cable
        to: "off"
        for: "00:00:05"
      - trigger: state
        entity_id: input_select.ev_vehicle_mode
        to: "off"
    conditions:
      - condition: numeric_state
        entity_id: input_number.ev_manual_charging_current
        above: 0
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_manual_charging_current
        data:
          value: 0

  - alias: "Wallbox: WARP3 LED Fahrzeug & SoC"
    id: wallbox_LED
    description: "Zero rot, Honda weiss, frei gruen. <50 % 1 Hz, 50-98 % 2 Hz, voll Regenbogen."
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.warp3_2ita_cable
          - binary_sensor.warp3_2ita_charging
          - binary_sensor.zero_sr_connected
          - binary_sensor.honda_e_connected
          - sensor.zero_sr_soc
          - sensor.honda_e_soc
    variables:
      # Zero zuerst - nur der wird per BLE positiv erkannt.
      vehicle: >-
        {% if is_state('binary_sensor.zero_sr_connected', 'on') %}zero
        {% elif is_state('binary_sensor.honda_e_connected', 'on') %}honda
        {% else %}none{% endif %}
      soc: >-
        {% if vehicle == 'zero' %}{{ states('sensor.zero_sr_soc') | float(0) }}
        {% elif vehicle == 'honda' %}{{ states('sensor.honda_e_soc') | float(0) }}
        {% else %}0{% endif %}
      hue: "{{ 120 if vehicle == 'none' else 0 }}"
      sat: "{{ 0 if vehicle == 'honda' else 255 }}"
      led_state: >-
        {% if vehicle == 'none' %}255
        {% elif soc | float(0) > 98 %}4
        {% elif soc | float(0) >= 50 %}3
        {% else %}2{% endif %}
    actions:
      - action: mqtt.publish
        data:
          topic: warp/2itA/evse/indicator_led_set
          payload: >-
            {{ {'state': led_state | int, 'color_h': hue | int,
                'color_s': sat | int, 'color_v': 255} | to_json }}
