################################################################################
# 1. BMS DATEN-EXTRAKTION
################################################################################
#command_line:
#  - sensor:
#      name: "UPS Raw Data"
#      unique_id: ups_raw_data
#      #command: "curl -s http://battery-bms.lan/show | grep -E 'Power:|SOC:|highest Cell|lowest Cell'"
#      command: "curl --max_time 2 -s http://192.168.0.134/show | grep -E 'Power:|SOC:|highest Cell|lowest Cell'"
#      scan_interval: 30
#      value_template: "{{ value }}"

################################################################################
# 2. HELFER (Entladesperre)
#
# Die Sperre ist ein Latch: einmal gesetzt, geht sie NICHT ueber die
# Zellspannung wieder auf (die erholt sich lastfrei binnen Sekunden und war
# genau deshalb die Ursache des Pulsens), sondern erst, wenn wirklich
# nachgeladen wurde - gemessen am SOC-Zuwachs gegenueber dem gemerkten Wert.
################################################################################
input_boolean:
  ups_entladesperre:
    name: "USV Entladesperre"
    icon: mdi:battery-alert-variant-outline

input_number:
  ups_lockout_soc:
    name: "USV SOC beim Sperren"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-low

################################################################################
# 3. SENSOREN
################################################################################
sensor:
  - platform: integration
    # Achtung ups_dc_power ist bei Entladung positiv, anders als die AC-Power
    source: sensor.ups_dc_power
    name: "UPS Riemann Energy"
    unique_id: ups_riemann_energy
    unit_prefix: k # Riemann liefert kWh
    round: 3
    method: left

################################################################################
# TEMPLATE SENSOREN
################################################################################
template:
  - sensor:
      - name: "UPS EnergyFlow Wh"
        unique_id: ups_energyflow_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        state: >
          {# Vorzeichenkorrektur: BMS entlädt positiv, also 1000 statt (-1000) #}
          {% set val = states('sensor.ups_riemann_energy') | float(0) * 1000 %}          
          {{ [[val, -50000] | max, 50000] | min }}

      - name: "Battery total charge power"
        unique_id: battery_total_charge_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set p1 = states('sensor.battery_charger_energy_power') | float(0) %}
          {% set p2 = states('sensor.battery_charger2_energy_power') | float(0) %}
          {{ (p1 + p2) | round(-1) }}

      - name: "UPS AC Power"
        unique_id: ups_ac_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set charging = states('sensor.battery_total_charge_power') | float(0) %}
          {% set discharging = states('sensor.battery_inverter_energy_power') | float(0) %}
          {{ (discharging - charging) | round(-1) }}

      - name: "UPS SOC raw"
        unique_id: ups_soc_raw
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: "{{ states('sensor.ant_bms_v2_ant_bms_soc') | is_number }}"
        state: "{{ states('sensor.ant_bms_v2_ant_bms_soc') | float(0) }}"

      - name: "UPS DC Power"
        unique_id: ups_dc_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # BMS reports positive while discharging.
        # Falling back to 0 here is intentional: it halts energy integration on a bad read.
        state: "{{ states('sensor.ant_bms_v2_ant_bms_power') | float(0) }}"

      - name: "UPS Highest Cell"
        unique_id: ups_highest_cell
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ states('sensor.ant_bms_v2_ant_bms_highest_cell') | float(0) }}"

      - name: "UPS Lowest Cell"
        unique_id: ups_lowest_cell
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ states('sensor.ant_bms_v2_ant_bms_lowest_cell') | float(0) }}"

      # Zellspreizung - Diagnose fuer die schwaechste Zelle. 10 mV im
      # mittleren SOC-Bereich, >150 mV am Entladeende = Balancing faellig.
      - name: "UPS Cell Delta"
        unique_id: ups_cell_delta
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: >-
          {% set hi = states('sensor.ups_highest_cell') | float(0) %}
          {% set lo = states('sensor.ups_lowest_cell') | float(0) %}
          {{ (hi - lo) | round(3) if hi > 2 and lo > 2 else 0 }}

  - trigger:
      - platform: state
        entity_id: sensor.ups_soc_raw
        not_to:
          - unknown
          - unavailable
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "UPS SOC"
        unique_id: ups_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >-
          {% set raw = states('sensor.ups_soc_raw') %}
          {% if is_number(raw) %}
            {{ raw | float }}
          {% else %}
            {{ this.state if is_number(this.state) else 'unknown' }}
          {% endif %}

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.ups_energyflow_wh
      - trigger: numeric_state
        entity_id: sensor.ups_highest_cell
        above: 3.55
        for: "00:00:10"
      - trigger: numeric_state
        entity_id: sensor.ups_soc
        above: "99.9"
        for: "00:01:00"
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "UPS Custom SOC"
        unique_id: ups_custom_soc
        unit_of_measurement: "%"
        device_class: battery
        state: >-
          {% set hw_soc = states('sensor.ups_soc') | float(-1) %}
          {% set neu_wh = states('sensor.ups_energyflow_wh') | float(none) %}
          {% set reset_wh = this.attributes.get('reset_point') | float(-1210) %}

          {% if neu_wh is none or reset_wh is none %}
            {{ this.state if is_number(this.state) else hw_soc }}
          {% elif hw_soc >= 100 %}
            100
          {% else %}
            {% set capacity = state_attr('sensor.global_parameter', 'ups_capacity_wh') | float(2200) %}
            {% set calc_soc = 100 - ((neu_wh - reset_wh) / capacity * 100) %}
            {{ calc_soc | round(1) | clamp(0, 100) }}
          {% endif %}
        attributes:
          reset_point: >-
            {% set raw_energy = states('sensor.ups_energyflow_wh') %}
            {% if not is_number(raw_energy) %}
              {# Energieflow noch nicht verfügbar (z.B. nach Neustart) -> letzten Wert halten #}
              {{ this.attributes.get('reset_point', 0) }}
            {% else %}
              {% set current_energy = raw_energy | float %}
              {% set last_reset = this.attributes.get('reset_point') | float(-1210) %}
              {% set hw_soc = states('sensor.ups_soc') | float(0) %}
              {% set custom_soc = this.state | float(none) %}
              {% set high_cell = states('sensor.ups_highest_cell') | float(0) %}
              {% set stop_soc = state_attr('sensor.global_parameter', 'stop_soc') | float(15) %}
              {% set lfp_max_voltage = state_attr('sensor.global_parameter', 'lfp_max_voltage') | float(3.565) %}
              {% set capacity = state_attr('sensor.global_parameter', 'ups_capacity_wh') | float(2200) %}
              {% set drift_too_high = custom_soc is not none and (hw_soc - custom_soc) | abs > 25 %}

              {% if custom_soc == 0 and hw_soc is not none and current_energy is not none %}
                {{ current_energy - ((100 - hw_soc) / 100 * capacity) }}
              {% elif hw_soc <= stop_soc or drift_too_high %}
                {{ current_energy - ((100 - hw_soc) / 100 * capacity) }}
              {% elif hw_soc >= 100 or high_cell > lfp_max_voltage %}
                {{ current_energy }}
              {% elif current_energy < last_reset %}
                {{ current_energy }}
              {% else %}
                {{ last_reset }}
              {% endif %}
            {% endif %}

  - trigger:
      - platform: state
        entity_id: sensor.ups_custom_soc
      - platform: time_pattern
        minutes: "/5"
    sensor:
      - name: "UPS free Capacity kWh"
        unique_id: ups_free_capacity_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {% set capacity = state_attr('sensor.global_parameter', 'ups_capacity_wh') | float(2200) %}
          {% set total_kwh = capacity / 1000 %} 

          {% set soc = states('sensor.ups_custom_soc') | float(-1) %}
          {{ (total_kwh * (1 - (soc / 100))) | round(2) if soc >= 0 else 0 }}
        availability: "{{ is_number(states('sensor.ups_custom_soc')) }}"

################################################################################
# 4. AUTOMATIONEN
################################################################################
automation:
  - alias: "UPS coarse_control"
    id: ups_coarse_control
    mode: queued
    max: 12
    trigger:
      - platform: state
        entity_id:
          - sensor.charge_power
          - sensor.ups_custom_soc
          - sensor.ups_lowest_cell
          - sensor.ups_highest_cell
          - input_number.manual_charge_power
          - binary_sensor.marstek_available
          - input_boolean.ups_entladesperre
      - platform: time_pattern
        minutes: "/2" # Fallback
    condition:
      - condition: template
        value_template: >-
          {% set lt = state_attr(this.entity_id, 'last_triggered') %}          
          {{ lt is none or (now() - lt).total_seconds() >= 12 }}
    action:
      # --- VARIABLEN VORZIEHEN ---
      - variables:
          netz: "{{ states('sensor.leistung_vom_netz') | float(0) }}" # <0 wenn einspeisung
          bat_pwr: "{{ states('sensor.marstek_ac_power_total') | float(0) }}" # <0 wenn laden
          ups_pwr: "{{ states('sensor.ups_ac_power') | float(0) }}" # <0 wenn laden
          # Feedback-free balance: add UPS output back so the inverter's own
          # discharge no longer moves the decision variable (stops oscillation)
          true_balance: "{{ netz + bat_pwr + ups_pwr }}"
          # Faellt die Marstek-Integration aus, ist bat_pwr = 0 und
          # true_balance damit um bis zu 5 kW falsch. Regel dann:
          # nichts NEU einschalten (Zweig 3 und 6), beim Abschalten
          # entscheidet ersatzweise der reine Netzbezug (Zweig 5).
          # Die Sicherheitszweige 0, 0.5 und 2 haengen nicht daran.
          marstek_ok: >-
            {{ is_state('binary_sensor.marstek_available', 'on')
               and has_value('sensor.marstek_ac_power_total') }}

          soc: "{{ states('sensor.ups_custom_soc') | float(0) }}"
          hw_soc: "{{ states('sensor.ups_soc') | float(0) }}"
          low_cell: "{{ states('sensor.ups_lowest_cell') | float(0) }}"
          high_cell: "{{ states('sensor.ups_highest_cell') | float(0) }}"
          lowest_soc: "{{ state_attr('sensor.global_parameter', 'lowest_soc') | float(12) }}"
          stop_soc: "{{ state_attr('sensor.global_parameter', 'stop_soc') | float(15) }}"
          # Parameter (Defaults = die Werte aus globals)
          max_v: "{{ state_attr('sensor.global_parameter', 'lfp_max_voltage') | float(3.565) }}"
          min_v: "{{ state_attr('sensor.global_parameter', 'lfp_min_voltage') | float(3.000) }}"
          hyst: "{{ state_attr('sensor.global_parameter', 'lfp_hysteresis') | float(0.040) }}"
          # NEU: eigene, deutlich groessere Hysterese NUR fuer den
          # Wiedereinstieg ins Entladen. lfp_hysteresis (40 mV) bleibt
          # unveraendert, weil sie in Zweig 6 die Ladeschwelle bestimmt -
          # dort wuerden 250 mV das Laden faktisch blockieren.
          # Der Lastsag betrug am 20.-22. rund 170 mV; alles darunter
          # laesst den Zyklus sofort wieder anlaufen.
          restart_hyst: "{{ state_attr('sensor.global_parameter', 'ups_restart_hyst') | float(0.25) }}"
          # Schalter Zustände
          inverter_an: "{{ is_state('switch.battery_inverter_tasmota', 'on') }}"
          charger1_on: "{{ is_state('switch.battery_charger', 'on') }}"
          charger2_on: "{{ is_state('switch.battery_charger2', 'on') }}"
          # Guard: fehlt das Entity (Tasmota offline, Integration neu geladen),
          # warf der direkte Zugriff auf .last_changed einen UndefinedError und
          # die ganze Automation brach ab. 0 = "gerade erst geschaltet" und
          # verhindert damit ein voreiliges Abschalten in Zweig 4.
          inverter_on_for: >-
            {% set st = states.switch.battery_inverter_tasmota %}
            {{ (now() - st.last_changed).total_seconds() if st is not none else 0 }}
          # NEU: Gegenstueck fuer den Wiedereinstieg. 9999 als Fallback -
          # fehlt das Entity, soll die Zeitsperre nicht zusaetzlich blockieren
          # (Zweig 3 verlangt ohnehin gueltige Zellspannungen).
          inverter_off_for: >-
            {% set st = states.switch.battery_inverter_tasmota %}
            {{ (now() - st.last_changed).total_seconds() if st is not none else 9999 }}
          # Entladesperre: gesetzt von Zweig 4 bzw. "UPS: Entladesperre setzen",
          # aufgehoben erst nach echtem Nachladen. Blockiert Zweig 3
          # (Entladen starten) und - genauso wichtig - Zweig 5 (Laden
          # stoppen), damit die Not-Ladung nicht nach 20 Sekunden wieder
          # abgewuergt wird.
          lockout: "{{ is_state('input_boolean.ups_entladesperre', 'on') }}"
          # Frueher: manual_charge_power >= 1000. Das war an die Venus-Ladung
          # gekoppelt und wurde von "Battery Maintenance: Stop When Full"
          # abgeschaltet, sobald die VENUS voll waren - lange bevor die USV
          # fertig war. Jetzt eigenes Flag (siehe control.yaml).
          maintenance_activ: "{{ is_state('input_boolean.ups_maintenance', 'on') }}"

      #netz    >0: kaufen
      #bat_pwr >0: entladen
      #ups_pwr >0: entladen
      #true_balance >0: Restbedarf (Verbrauch > PV), unabhängig von Speicherzustand
      #true_balance <0: Überschuss
      - choose:
          # 0 --- keine Verbindung zum BMS
          - conditions:
              - condition: template
                value_template: "{{ high_cell == 0 and low_cell == 0 }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.battery_inverter_tasmota
                    - switch.battery_charger
                    - switch.battery_charger2
              - action: persistent_notification.create
                data:
                  title: "⚠️ BMS Verbindung verloren"
                  message: "Keine Verbindung zum BMS – alle Schalter abgeschaltet! ({{ now().strftime('%H:%M:%S') }})"
                  notification_id: "bms_no_connection"

          # 0.5 --- CELL OVERVOLTAGE: stop charging unconditionally
          - conditions:
              - condition: template
                value_template: "{{ high_cell > max_v and (charger1_on or charger2_on) }}"
            sequence:
              - action: switch.turn_off
                target:
                  {
                    entity_id:
                      [switch.battery_charger, switch.battery_charger2],
                  }

          # 1 --- Wartungsmodus ein
          - conditions:
              - condition: template
                value_template: "{{ maintenance_activ and high_cell < max_v }}"
            sequence:
              - action: switch.turn_off
                target: { entity_id: switch.battery_inverter_tasmota }
              - action: switch.turn_on
                target: { entity_id: switch.battery_charger2 }
              - action: persistent_notification.dismiss
                data:
                  notification_id: "bms_no_connection"

          # 2 --- NOT-LADUNG / Entladesperre aktiv
          #
          # Ausloeser ist jetzt das Latch, nicht mehr die Momentanspannung.
          # Vorher: low_cell < min_v -> laden, Spannung erholt sich sofort ->
          # Bedingung weg -> Zweig 5 schaltet ab -> Spannung faellt zurueck ->
          # von vorne. Das war das Pulsen. Solange die Sperre steht, laeuft
          # charger2 durch, bis "UPS: Entladesperre freigeben" sie aufhebt.
          - conditions:
              - condition: template
                value_template: >-
                  {{ (lockout or soc <= lowest_soc or low_cell < min_v)  
                     and not bat_pwr > 0
                     and not is_state('switch.battery_charger2', 'on') }}
            sequence:
              - action: switch.turn_off
                target: { entity_id: switch.battery_inverter_tasmota }
              - action: switch.turn_on
                target: { entity_id: switch.battery_charger2 }
              - action: persistent_notification.dismiss
                data:
                  notification_id: "bms_no_connection"

          # 2.5 --- ENDE: NOT-LADUNG
          #
          # Auch während der Entladesperre, das Laden der ups beenden
          # damit nicht die marstek die ups ringladen.
          - conditions:
              - condition: template
                value_template: >-
                  {{ lockout and bat_pwr > 0 and is_state('switch.battery_charger2', 'on') }}
            sequence:
              - action: switch.turn_off
                target: { entity_id: switch.battery_charger2 }
              - action: persistent_notification.dismiss
                data:
                  notification_id: "bms_no_connection"

          # 3 --- ENTLADEN STARTEN
          #
          # GEAENDERT: zwei zusaetzliche Bremsen gegen das Pulsen.
          # a) restart_hyst statt hyst - die Zelle muss sich wirklich
          #    erholt haben, nicht nur 40 mV ueber min_v liegen.
          # b) inverter_off_for > 300 - selbst wenn die Spannung passt,
          #    hoechstens alle 5 Minuten ein neuer Versuch. Das ist die
          #    eigentliche Versicherung gegen Relaiszyklen im 20-s-Takt.
          - conditions:
              - condition: template
                value_template: >-
                  {{ (true_balance > 180) and marstek_ok and soc > 35
                     and low_cell > min_v + restart_hyst
                     and inverter_off_for > 300
                     and not lockout and not inverter_an }}
            sequence:
              - action: switch.turn_off
                target:
                  {
                    entity_id:
                      [switch.battery_charger, switch.battery_charger2],
                  }
              - action: switch.turn_on
                target: { entity_id: switch.battery_inverter_tasmota }
              - action: persistent_notification.dismiss
                data:
                  notification_id: "bms_no_connection"

          #netz    >0: kaufen
          #bat_pwr >0: entladen
          #ups_pwr >0: entladen
          #true_balance >0: Restbedarf (Verbrauch > PV), unabhängig von Speicherzustand
          #true_balance <0: Überschuss

          # 4 --- ENTLADEN STOPPEN
          - conditions:
              - condition: template
                value_template: >-
                  {# Ohne gueltige Marstek-Daten laeuft der Inverter einfach
                     weiter - abschalten nur noch ueber SOC/Zellspannung.
                     Ein Aussetzer soll keine unnoetigen Relaiszyklen
                     ausloesen; wieder eingeschaltet wird in Zweig 3 ohnehin
                     erst mit gueltigen Daten. #}
                  {{ ((true_balance < 50 and inverter_on_for > 30 and marstek_ok)
                      or soc <= 20 or low_cell < min_v or lockout) 
                     and inverter_an }}
            sequence:
              - action: switch.turn_off
                target: { entity_id: switch.battery_inverter_tasmota }
              # NEU: Latch hier setzen, nicht erst in "UPS: Entladesperre
              # setzen". Deren "for: 15s" wurde nie erreicht - dieser Zweig
              # schaltet den Inverter schon nach wenigen Sekunden ab, die
              # Zelle erholt sich, die Trigger-Bedingung faellt weg und die
              # Sperre armierte nie. Wer abschaltet, sperrt auch.
              - if:
                  - condition: template
                    value_template: >-
                      {{ (low_cell < min_v or soc <= lowest_soc) and not lockout }}
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.ups_lockout_soc }
                    data:
                      value: "{{ soc | round(1) }}"
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.ups_entladesperre }
                  - action: logbook.log
                    data:
                      name: "USV Entladesperre"
                      message: >-
                        Gesetzt beim Abschalten des Inverters: SOC {{ soc }} %,
                        niedrigste Zelle {{ low_cell }} V,
                        Spreizung {{ states('sensor.ups_cell_delta') }} V.
              - action: persistent_notification.dismiss
                data:
                  notification_id: "bms_no_connection"

          # 5 --- LADEN STOPPEN (Inklusive < 30W Logik)
          - conditions:
              - condition: template
                value_template: >-
                  {# stop on true grid pull, full pack, cell limit, trickle, OR marstek discharging.
                     Ohne gueltige Marstek-Daten ist true_balance nicht
                     aussagekraeftig - dann entscheidet der reine Netzbezug.
                     Das ist die konservative Richtung: lieber eine echte
                     PV-Ladung zu frueh beenden als drei Minuten lang aus
                     dem Netz laden.
                     NEU: bei aktiver Entladesperre greift dieser Zweig nicht.
                     Die Not-Ladung darf Netzbezug verursachen - sie ist der
                     einzige Weg aus der Sperre heraus. Begrenzt wird sie
                     durch die Freigabe (SOC + Delta), nicht durch die
                     Bilanz. #}
                  {{ not lockout
                    and ((true_balance > 50 if marstek_ok else netz > 50)
                      or high_cell > max_v or bat_pwr > 50
                      or (ups_pwr > -15 and soc > 95))
                    and (charger1_on or charger2_on) and soc >= stop_soc }}

            sequence:
              - action: switch.turn_off
                target:
                  {
                    entity_id:
                      [switch.battery_charger, switch.battery_charger2],
                  }
              - action: persistent_notification.dismiss
                data:
                  notification_id: "bms_no_connection"

          #netz    >0: kaufen
          #bat_pwr >0: entladen
          #ups_pwr >0: entladen
          #true_balance >0: Restbedarf (Verbrauch > PV), unabhängig von Speicherzustand
          #true_balance <0: Überschuss

          # 6 --- LADEN STARTEN
          - conditions:
              - condition: template
                value_template: >-
                  {{ true_balance < -820 and marstek_ok
                    and soc < 100 and high_cell < max_v - hyst
                    and bat_pwr < 50
                    and not inverter_an and not (charger1_on and charger2_on) }}

            sequence:
              - action: switch.turn_on
                target: { entity_id: switch.battery_charger }
              - if:
                  - condition: template
                    value_template: "{{ true_balance < -1200 and (soc < 99 or hw_soc < 100) }}"
                then:
                  - delay: "00:00:01"
                  - action: switch.turn_on
                    target: { entity_id: switch.battery_charger2 }
              - action: persistent_notification.dismiss
                data:
                  notification_id: "bms_no_connection"

  # ==========================================================
  # USV: Entladesperre setzen
  #
  # Bleibt als Fallback: greift, wenn der Inverter gar nicht laeuft und der
  # SOC langsam wegdriftet. Der Hauptweg ist jetzt Zweig 4 in
  # ups_coarse_control - dort ist die Bedingung race-frei, weil sie im
  # selben Schritt wie das Abschalten ausgewertet wird.
  # Das "for: 15s" ist hier weiterhin richtig - ohne das setzt jeder
  # Wasserkocher die Sperre.
  # ==========================================================
  - alias: "UPS: Entladesperre setzen"
    id: ups_lockout_set
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {% set min_v = state_attr('sensor.global_parameter', 'lfp_min_voltage') | float(3.000) %}
          {{ states('sensor.ups_lowest_cell') | float(9) < min_v }}
        for: "00:00:15"
      - trigger: template
        value_template: >-
          {% set lowest = state_attr('sensor.global_parameter', 'lowest_soc') | float(12) %}
          {{ states('sensor.ups_custom_soc') | float(100) <= lowest }}
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: input_boolean.ups_entladesperre
        state: "off"
      # Plausibilitaet: bei 0 V liefert das BMS nichts, dafuer ist Zweig 0 da.
      - condition: numeric_state
        entity_id: sensor.ups_lowest_cell
        above: 2.0
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.ups_lockout_soc }
        data:
          value: "{{ states('sensor.ups_custom_soc') | float(0) | round(1) }}"
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.ups_entladesperre }
      - action: logbook.log
        data:
          name: "USV Entladesperre"
          message: >-
            Gesetzt bei SOC {{ states('sensor.ups_custom_soc') }} %,
            niedrigste Zelle {{ states('sensor.ups_lowest_cell') }} V,
            Spreizung {{ states('sensor.ups_cell_delta') }} V.

  # ==========================================================
  # USV: Entladesperre freigeben
  #
  # Zwei Bedingungen gleichzeitig: SOC muss um das Delta gestiegen sein UND
  # die niedrigste Zelle muss ueber min_v + restart_hyst liegen.
  # GEAENDERT: hier dieselbe grosse Hysterese wie in Zweig 3. Mit den alten
  # 40 mV waere die Sperre bei 3,04 V gefallen und Zweig 3 haette bei
  # exakt derselben Spannung sofort wieder losgelegt - die Freigabe haette
  # das Pulsen nur um den Ladevorgang verzoegert.
  # ==========================================================
  - alias: "UPS: Entladesperre freigeben"
    id: ups_lockout_release
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.ups_custom_soc
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.ups_entladesperre
        state: "on"
      - condition: template
        value_template: >-
          {% set min_v = state_attr('sensor.global_parameter', 'lfp_min_voltage') | float(3.000) %}
          {% set hyst  = state_attr('sensor.global_parameter', 'ups_restart_hyst') | float(0.25) %}
          {% set delta = state_attr('sensor.global_parameter', 'ups_lockout_soc_delta') | float(10) %}
          {% set soc  = states('sensor.ups_custom_soc') | float(0) %}
          {% set lock = states('input_number.ups_lockout_soc') | float(0) %}
          {% set low  = states('sensor.ups_lowest_cell') | float(0) %}
          {{ soc >= lock + delta and low > min_v + hyst }}
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.ups_entladesperre }
      - action: logbook.log
        data:
          name: "USV Entladesperre"
          message: >-
            Freigegeben bei SOC {{ states('sensor.ups_custom_soc') }} %
            (gesperrt bei {{ states('input_number.ups_lockout_soc') }} %),
            niedrigste Zelle {{ states('sensor.ups_lowest_cell') }} V.

  # ==========================================================
  # USV: Entladesperre haengt
  #
  # Bewusst NUR Meldung, keine automatische Freigabe. Wenn der SOC nach
  # Stunden Ladung nicht steigt, ist entweder der reset_point verdriftet
  # oder eine Zelle defekt - in beiden Faellen ist "weiter gesperrt" die
  # richtige Antwort, nicht "trotzdem entladen".
  # ==========================================================
  - alias: "UPS: Entladesperre haengt"
    id: ups_lockout_stuck
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.ups_entladesperre
        to: "on"
        for: "06:00:00"
    actions:
      - action: persistent_notification.create
        data:
          title: "⚠️ USV Entladesperre seit 6 h aktiv"
          message: >-
            SOC {{ states('sensor.ups_custom_soc') }} % (gesperrt bei
            {{ states('input_number.ups_lockout_soc') }} %), niedrigste Zelle
            {{ states('sensor.ups_lowest_cell') }} V, Spreizung
            {{ states('sensor.ups_cell_delta') }} V. Laedt charger2 wirklich?
          notification_id: "ups_lockout_stuck"

  - alias: "Sicherheitsabschaltung: Charger und Inverter gleichzeitig"
    id: safety_simultaneous_power
    mode: single
    trigger:
      - platform: state
        entity_id:
          - switch.battery_inverter_tasmota
          - switch.battery_charger
          - switch.battery_charger2
        to: "on"
        for: "00:00:00.500"
    condition:
      - condition: template
        value_template: >-
          {{ is_state('switch.battery_inverter_tasmota', 'on') and 
             (is_state('switch.battery_charger', 'on') or is_state('switch.battery_charger2', 'on')) }}
    action:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.battery_inverter_tasmota
            - switch.battery_charger
            - switch.battery_charger2

  # ==========================================================
  # UPS: Last Full Zeitstempel
  # ==========================================================
  - alias: "UPS: last full timestamp"
    id: ups_set_last_full_timestamp
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ups_custom_soc
        above: 99.9
        for: "00:05:00"
      - trigger: numeric_state
        entity_id: sensor.ups_soc
        above: 99.9
        for: "00:05:00"
    conditions:
      - condition: numeric_state
        entity_id: sensor.ups_custom_soc
        above: 99.9
      - condition: numeric_state
        entity_id: sensor.ups_soc
        above: 99.9
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ups_last_full
        data:
          timestamp: "{{ now().timestamp() }}"

  # ==========================================================
  # USV: Wartungsladung (eigener Zyklus, unabhaengig von den Venus)
  #
  # Start/Stopp setzen nur input_boolean.ups_maintenance. Das eigentliche
  # Schalten macht ups_coarse_control Zweig 1 (Inverter aus,
  # battery_charger2 an) - Zweig 0.5 (Zellueberspannung) steht davor und
  # bleibt damit weiterhin die harte Sicherheitsgrenze.
  # ==========================================================
  - alias: "Battery Maintenance: Start UPS Charge"
    id: battery_maintenance_ups_charge
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "00:05:00"
      - trigger: time_pattern
        minutes: "/30"
    conditions:
      # Ganze Nacht statt nur bis Mitternacht - siehe gleiche Aenderung in
      # battery_maintenance_night_charge. Fuer die USV besonders relevant:
      # sie braucht 3-5 h, ein Abbruch nach Mitternacht war bisher ein
      # verlorener Tag.
      - condition: template
        value_template: "{{ is_state('sun.sun', 'below_horizon') }}"
      - condition: state
        entity_id: input_boolean.ups_maintenance
        state: "off"
      - condition: template
        value_template: >-
          {% set days = state_attr('sensor.global_parameter', 'battery_care_days') | float(8) %}
          {% set now_ts = as_timestamp(now()) %}
          {% set age = (now_ts - as_timestamp(states('input_datetime.ups_last_full'), now_ts))
                       if has_value('input_datetime.ups_last_full') else 0 %}
          {{ age > days * 86400 }}
      # Nicht starten, wenn das BMS keine plausiblen Zellspannungen liefert.
      - condition: numeric_state
        entity_id: sensor.ups_lowest_cell
        above: 2.0
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ups_maintenance
      - action: logbook.log
        data:
          name: "Battery Maintenance"
          message: "USV-Wartungsladung gestartet."

  - alias: "Battery Maintenance: Stop UPS Charge"
    id: battery_maintenance_ups_stop
    mode: single
    triggers:
      # Voll ueber den gerechneten SOC ...
      - trigger: numeric_state
        entity_id: sensor.ups_custom_soc
        above: 99.5
        for: "00:02:00"
      # ... oder ueber die Zellspannung. Der zweite Weg ist der
      # verlaesslichere: ups_custom_soc kann bei driftendem reset_point
      # haengenbleiben und 100 % nie erreichen.
      # Template-Trigger, damit die Schwelle aus sensor.global_parameter
      # kommt (lfp_max_voltage) und nicht doppelt gepflegt werden muss.
      - trigger: template
        value_template: >-
          {% set max_v = state_attr('sensor.global_parameter', 'lfp_max_voltage') | float(3.565) %}
          {{ states('sensor.ups_highest_cell') | float(0) > max_v }}
        for: "00:00:30"
      # Harter Abbruch am Morgen - ohne den bliebe das Flag bei einer
      # defekten Zelle oder einem BMS-Aussetzer fuer immer "on".
      - trigger: sun
        event: sunrise
    conditions:
      - condition: state
        entity_id: input_boolean.ups_maintenance
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ups_maintenance
      # Zeitstempel hier mitsetzen, wenn wirklich voll geladen wurde.
      # "UPS: last full timestamp" verlangt > 99.9 auf BEIDEN SOC-Sensoren
      # fuer 5 Minuten - das wird nach einem sauber beendeten Zyklus
      # (Stopp bereits bei 99.5 bzw. an der Zellspannung) oft nicht mehr
      # erreicht. Ohne diesen Stempel bliebe ups_last_full alt und der
      # Zyklus wuerde jede Nacht erneut anlaufen.
      - if:
          - condition: template
            value_template: >-
              {% set max_v = state_attr('sensor.global_parameter', 'lfp_max_voltage') | float(3.565) %}
              {{ states('sensor.ups_custom_soc') | float(0) > 99.5
                 or states('sensor.ups_highest_cell') | float(0) > max_v }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ups_last_full
            data:
              timestamp: "{{ now().timestamp() }}"
      - action: logbook.log
        data:
          name: "Battery Maintenance"
          message: >-
            USV-Wartungsladung beendet (SOC {{ states('sensor.ups_custom_soc') }} %,
            hoechste Zelle {{ states('sensor.ups_highest_cell') }} V).
