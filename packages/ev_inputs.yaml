# ============================================================
# PV surplus wallbox charging (WARP3) - Inputs
# ============================================================

input_select:
  ev_vehicle_mode:
    name: "EV Vehicle Mode"
    options:
      - "off"
      - "zero"
      - "honda_e"
    #initial: "off"
    icon: mdi:car-electric

  ev_charge_mode:
    name: "EV Charge Mode"
    options:
      - "pv_shared_50_50" # 3. PV-Überschuss Fahrzeug-Batterie halbe/halbe
      - "pv_ev_first" # 1. PV-Überschuss Fahrzeug priorisiert
      - "pv_battery_first" # 2. PV-Überschuss Batterien priorisiert
      - "min_6a_floor_battery" # 4. Min. 1.3kW (6A), Max aus PV, Batterie-Schutz aktiv
      - "min_6a_floor_grid" # 5. Min. 1.3kW (6A), Max aus PV, ohne Batterie-Schutz
      - "target_time" # 6. Fertig bis input_datetime.ev_target_time
    #initial: "pv_ev_first"
    icon: mdi:ev-station

input_datetime:
  # Zielzeit fuer charge_mode "target_time". Ohne Datum -> gemeint ist immer
  # das naechste Auftreten dieser Uhrzeit. Anstecken um 20:00 bei Zielzeit
  # 07:00 heisst also morgen frueh; Anstecken um 08:00 heisst uebermorgen
  # 07:00, dazwischen laeuft die PV-Vorladung.
  ev_target_time:
    name: "EV Zielzeit"
    has_date: false
    has_time: true
    icon: mdi:clock-check

input_number:
  ev_manual_charging_current:
    name: "EV Manual Charging Current (0 = Automatic)"
    initial: 0
    min: 0
    max: 32
    step: 1
    unit_of_measurement: "A"
    icon: mdi:car-speed-limiter

  ev_charge_by_percent:
    name: "EV charge BY Percent"
    #initial: 50
    min: 0
    max: 100
    # step 1 statt 5: der Wert wird von wallbox_calc_charge_delta gerechnet
    # (z.B. 7.1) - mit step 5 zeigte der Slider stattdessen 5 an und der
    # angezeigte Wert passte nicht zum Energieziel.
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-charging-50

  ev_charge_to_percent:
    name: "EV charge TO Percent"
    #initial: 50
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-charging-50

  ev_session_start_energy_kwh:
    name: "EV Session Start Energy (snapshot)"
    min: 0
    max: 9999999
    step: 0.001
    unit_of_measurement: "kWh"
    icon: mdi:counter
