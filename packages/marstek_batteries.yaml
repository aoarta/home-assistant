# packages/marstek_batteries.yaml
#
# Erweitert auf DREI Venus-Speicher.
#
# Die Lade-/Entladeverteilung wurde von der fest verdrahteten Zwei-Geraete-
# Logik auf eine Schleife ueber eine Geraeteliste umgestellt. Ein vierter
# Speicher braucht dann nur noch neue Eintraege in den Listen (ids, ctl,
# soc_raw, ...) und in range(3) -> range(4).
#
# OPTIMIERT 2026-10: die drei identischen Custom-SOC-Bloecke (State,
# reset_point, zelle_leer) und die sechs identischen Time-until-Sensoren
# liegen jetzt als Makros in custom_templates/soc_macros.jinja - hier stehen
# nur noch duenne Aufrufbloecke mit der Geraetenummer. Logik 1:1 unveraendert
# (~250 Zeilen Dreifachcode entfernt). Ein vierter Speicher: Aufrufblock
# kopieren, Geraetenummer und reset_default anpassen - plus wie bisher die
# Listen weiter unten erweitern.
#
# GEAENDERT 2026-10-22: override_soc faellt erst zurueck, wenn JEDER Speicher
# seit dem Einschalten mindestens einmal voll war. Der Einschaltzeitpunkt
# liegt in input_datetime.override_soc_since (ueberlebt HA-Neustarts).
#
# GEAENDERT 2026-11: Entladen mit Deckel 2500 W + Umverteilung, volle bzw.
# ungesteuerte Venus bekommen keinen Ladeanteil mehr, manual nimmt
# zusaetzlichen PV-Ueberschuss mit (Details an den Stellen selbst).
# Venus X Energy Wh ohne 0/100000-Begrenzung, limits_map ohne
# solar_soc_logic.now_ts.
#
# GEAENDERT 2026-11-13: PRAESENZ je Venus (binary_sensor.venus_X_vorhanden).
# Fehlte ein Speicher, blieb marstek_available dauerhaft aus ->
# charge_power unavailable -> die anderen luden nicht. Ausserdem blieben
# override_soc und die Wartungsladung am fehlenden Speicher haengen.
# Watchdog, Summen (AC/DC/SOC/usable Energy), ctl-Listen, Wartungsladung
# und override_soc rechnen jetzt nur noch ueber VORHANDENE Speicher.

input_datetime:
  override_soc_since:
    name: "Override SOC aktiv seit"
    has_date: true
    has_time: true

sensor:
  - platform: filter
    name: "Marstek Venus 1 AC Leistung glatt"
    unique_id: marstek_venus_1_ac_power_glatt
    entity_id: sensor.marstek_venus_1_ac_power
    filters:
      - filter: lowpass
        time_constant: 5
        precision: 0
  - platform: filter
    name: "Marstek Venus 2 AC Leistung glatt"
    unique_id: marstek_venus_2_ac_power_glatt
    entity_id: sensor.marstek_venus_2_ac_power
    filters:
      - filter: lowpass
        time_constant: 5
        precision: 0
  - platform: filter
    name: "Marstek Venus 3 AC Leistung glatt"
    unique_id: marstek_venus_3_ac_power_glatt
    entity_id: sensor.marstek_venus_3_ac_power
    filters:
      - filter: lowpass
        time_constant: 5
        precision: 0

  - platform: integration
    source: sensor.marstek_venus_1_batterieleistung
    name: "Venus 1 Riemann"
    unique_id: venus_1_riemann
    unit_prefix: k # Ergebnis ist in kWh
    round: 3
    method: left

  - platform: integration
    source: sensor.marstek_venus_2_batterieleistung
    name: "Venus 2 Riemann"
    unique_id: venus_2_riemann
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.marstek_venus_3_batterieleistung
    name: "Venus 3 Riemann"
    unique_id: venus_3_riemann
    unit_prefix: k
    round: 3
    method: left

################################################################################
################################################################################
################################################################################
template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.venus_1_energy_wh
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_1_soc
        above: 99.9
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_1_modbus_minimale_zellenspannung
        below: 2.95
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "Venus 1 Custom SOC"
        unique_id: venus_1_custom_soc
        unit_of_measurement: "%"
        device_class: battery
        state: >-
          {% from 'soc_macros.jinja' import custom_soc_state %}
          {{ custom_soc_state(1, 48840, this.state, this.attributes.get('reset_point')) }}
        attributes:
          reset_point: >-
            {% from 'soc_macros.jinja' import custom_soc_reset_point %}
            {{ custom_soc_reset_point(1, 48840, this.state, this.attributes.get('reset_point'), this.attributes.get('zelle_leer', false)) }}
          zelle_leer: >-
            {% from 'soc_macros.jinja' import custom_soc_zelle_leer %}
            {{ custom_soc_zelle_leer(1, this.state, this.attributes.get('zelle_leer', false)) }}

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.venus_2_energy_wh
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_2_soc
        above: 99.9
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_2_modbus_minimale_zellenspannung
        below: 2.95
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "Venus 2 Custom SOC"
        unique_id: venus_2_custom_soc
        unit_of_measurement: "%"
        device_class: battery
        state: >-
          {% from 'soc_macros.jinja' import custom_soc_state %}
          {{ custom_soc_state(2, 47381, this.state, this.attributes.get('reset_point')) }}
        attributes:
          reset_point: >-
            {% from 'soc_macros.jinja' import custom_soc_reset_point %}
            {{ custom_soc_reset_point(2, 47381, this.state, this.attributes.get('reset_point'), this.attributes.get('zelle_leer', false)) }}
          zelle_leer: >-
            {% from 'soc_macros.jinja' import custom_soc_zelle_leer %}
            {{ custom_soc_zelle_leer(2, this.state, this.attributes.get('zelle_leer', false)) }}

  # Venus 3: reset_default 50000 ist seit 2026-11 nur noch letzter
  # Rueckfall. Fehlt reset_point (Neuanlage), verankert soc_macros.jinja
  # aus Hardware-SOC und Energy Wh - der Custom-SOC startet also auf dem
  # Hardware-SOC, egal wie voll der Speicher bei Inbetriebnahme ist.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.venus_3_energy_wh
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_3_soc
        above: 99.9
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_3_modbus_minimale_zellenspannung
        below: 2.95
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "Venus 3 Custom SOC"
        unique_id: venus_3_custom_soc
        unit_of_measurement: "%"
        device_class: battery
        state: >-
          {% from 'soc_macros.jinja' import custom_soc_state %}
          {{ custom_soc_state(3, 50000, this.state, this.attributes.get('reset_point')) }}
        attributes:
          reset_point: >-
            {% from 'soc_macros.jinja' import custom_soc_reset_point %}
            {{ custom_soc_reset_point(3, 50000, this.state, this.attributes.get('reset_point'), this.attributes.get('zelle_leer', false)) }}
          zelle_leer: >-
            {% from 'soc_macros.jinja' import custom_soc_zelle_leer %}
            {{ custom_soc_zelle_leer(3, this.state, this.attributes.get('zelle_leer', false)) }}

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_1_soc
        above: 99.9
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_2_soc
        above: 99.9
      - trigger: numeric_state
        entity_id: sensor.marstek_venus_3_soc
        above: 99.9
      - trigger: state
        entity_id:
          - binary_sensor.venus_1_vorhanden
          - binary_sensor.venus_2_vorhanden
          - binary_sensor.venus_3_vorhanden
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "Marstek usable Energy"
        unique_id: marstek_usable_energy
        unit_of_measurement: "kWh"
        device_class: energy
        # Kein availability-Template mehr. Frueher verlangte es zusaetzlich
        # die HARDWARE-SOCs - und genau die fallen beim Modbus-Timeout
        # als erstes aus. Der Sensor ging dann auf "unavailable",
        # control.yaml las ihn mit | float(0) als leeren Speicher und
        # target_soc sprang auf 130 ("Tagesbilanz negativ"), obwohl die
        # Speicher voll waren. Die HW-SOCs werden hier ohnehin nur als
        # Notfallwert gebraucht; gerechnet wird mit den Custom-SOCs.
        #
        # Gezaehlt werden nur VORHANDENE Speicher (2026-11-13). Der
        # Custom-SOC eines fehlenden Speichers kann eingefroren auf einem
        # alten Wert stehen und haette die nutzbare Energie aufgeblaeht.
        # Faellt ein vorhandener aus, wird er mit 0 kWh gewertet. Das
        # Einfrieren des letzten guten Werts bleibt dem Fall vorbehalten,
        # dass gar kein Custom-SOC lesbar ist.
        state: >-
          {% set min_soc = state_attr('sensor.solar_soc_logic', 'min') | float(15) %}
          {% set ns = namespace(sum=0, ok=0) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% set soc = states('sensor.venus_' ~ i ~ '_custom_soc') %}
            {% if is_number(soc) %}
              {% set cap = states('sensor.marstek_venus_' ~ i ~ '_batterie_gesamtenergie') | float(5.120) %}
              {% set ns.ok = ns.ok + 1 %}
              {% set ns.sum = ns.sum + ([0, (soc | float(0)) - min_soc] | max) / 100 * cap %}
            {% endif %}
          {% endfor %}
          {% if ns.ok == 0 %}
            {# Kein SOC lesbar: letzten guten Wert halten. Ein eingefrorener
               Wert ist beim Modbus-Aussetzer die deutlich harmlosere Luege
               als eine gemeldete 0 - die Bilanzstufen in control.yaml haengen
               direkt daran. Wie lange schon eingefroren wird, steht im
               Attribut "stale" bzw. in binary_sensor.marstek_available. #}
            {{ this.state if is_number(this.state) else 0 }}
          {% else %}
            {{ ns.sum | round(3) }}
          {% endif %}
        attributes:
          stale: >-
            {% set ns = namespace(s=false) %}
            {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
              {% if not is_number(states('sensor.venus_' ~ i ~ '_custom_soc')) %}{% set ns.s = true %}{% endif %}
            {% endfor %}
            {{ ns.s }}
          missing: >-
            {% set ns = namespace(l=[]) %}
            {% for i in [1, 2, 3] %}
              {% if not is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
                {% set ns.l = ns.l + ['venus_' ~ i ~ ' (nicht vorhanden)'] %}
              {% elif not has_value('sensor.venus_' ~ i ~ '_custom_soc') %}
                {% set ns.l = ns.l + ['sensor.venus_' ~ i ~ '_custom_soc'] %}
              {% endif %}
            {% endfor %}
            {{ ns.l | join(', ') }}

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_number.manual_charge_power
          - input_boolean.override_soc
          - binary_sensor.einspeisen_besser_als_speichern # tarife
          - binary_sensor.entladen_sperren # tarife
          - binary_sensor.venus_1_vorhanden
          - binary_sensor.venus_2_vorhanden
          - binary_sensor.venus_3_vorhanden
        for:
          milliseconds: 2000
      - trigger: state
        entity_id: sensor.charge_power

    variables:
      # ---------------------------------------------------------------
      # Ladeleistungs-Deckel je Speicher am Nachmittag.
      # Unveraendertes Prinzip, nur ueber die Geraeteliste geschleift.
      # ---------------------------------------------------------------
      limits_map: >-
        {% set default = {'v1': 2500, 'v2': 2500, 'v3': 2500} %}
        {# frueher solar_soc_logic.now_ts - das Attribut ist weg (Recorder) #}
        {% set ts = as_timestamp(now()) %}
        {% set sun_set_minus_3h = state_attr('sensor.solar_soc_logic', 'sun_set_minus_3h') | float(0) %}
        {% set t1115 = state_attr('sensor.solar_soc_logic', 't1115') | float(0) %}
        {% set ziel_soc = states('sensor.target_soc') | float(80) %}

        {% if ts >= t1115 and ts < sun_set_minus_3h and ziel_soc < 100 %}
          {% set capacity = state_attr('sensor.global_parameter', 'venus_capacity_wh') | float(5120) %}
          {% set dauer = [(sun_set_minus_3h - ts) / 3600, 0.01] | max %}
          {% set fak = capacity / 100 / dauer * 2.5 %}
          {% set socs = [
               states('sensor.venus_1_custom_soc') | float(20),
               states('sensor.venus_2_custom_soc') | float(20),
               states('sensor.venus_3_custom_soc') | float(20)
             ] %}
          {% set ns = namespace(o=[]) %}
          {% for i in range(3) %}
            {% set raw = [((ziel_soc - socs[i]) | clamp(0,100) * fak) | round(0) | int(0), 2500] | min %}
            {% set ns.o = ns.o + [([raw, 500] | max) if raw > 0 else 0] %}
          {% endfor %}
          {{ {'v1': ns.o[0], 'v2': ns.o[1], 'v3': ns.o[2]} }}
        {% else %}
          {{ default }}
        {% endif %}

      # ---------------------------------------------------------------
      # LADEVERTEILUNG
      #
      # Ablauf:
      #   1. Bedarf w_i = Ziel-SOC - Ist-SOC (0 ohne Steuermodus, bei
      #      nicht vorhandenem Speicher oder wenn der Hardware-SOC voll
      #      meldet)
      #   2. proportionale Rohverteilung des Ueberschusses
      #   3. Mindest-Sollwert (floor) anheben, den Aufschlag bei den
      #      groesseren Werten abziehen -> Summe bleibt gleich, es wird
      #      nie mehr angefordert als Ueberschuss da ist
      #   4. Deckel aus limits_map anwenden, den abgeschnittenen Rest auf
      #      die Speicher mit Luft verteilen (zwei Durchlaeufe)
      #
      # floor skaliert mit der Zahl der aktiven Speicher: 500 W je Geraet
      # erst ab 500 * n_aktiv Gesamtleistung, sonst 200 W ab 200 * n_aktiv.
      # Damit ist Schritt 3 rechnerisch immer erfuellbar.
      # ---------------------------------------------------------------
      charge_map: >-
        {% set ctl = [
             is_state('switch.marstek_venus_1_modbus_rs485_steuermodus', 'on') and is_state('binary_sensor.venus_1_vorhanden', 'on'),
             is_state('switch.marstek_venus_2_modbus_rs485_steuermodus', 'on') and is_state('binary_sensor.venus_2_vorhanden', 'on'),
             is_state('switch.marstek_venus_3_modbus_rs485_steuermodus', 'on') and is_state('binary_sensor.venus_3_vorhanden', 'on')
           ] %}
        {% set soc_raw = [
             states('sensor.venus_1_custom_soc'),
             states('sensor.venus_2_custom_soc'),
             states('sensor.venus_3_custom_soc')
           ] %}
        {% set manual = states('input_number.manual_charge_power') | float(0) %}

        {% if manual > 0 %}
          {# Voll gemeldete Batterie nicht weiter anfordern.
             Ohne diese Pruefung entstand ein Ping-Pong: sobald ein Venus > 99
             war, setzte "Marstek: Zeitstempel Batterie voll aktualisieren"
             number.marstek_venus_X_charge_power auf 0, und sende_batterie_targets_v4
             schrieb beim naechsten Trigger wieder den vollen manual-Wert hinein.
             Der Steuermodus-Switch wird ebenfalls beruecksichtigt - ohne
             Modbus-Steuerung nimmt der Speicher den Wert ohnehin nicht an. #}
          {# Mindestens manual je Speicher; liegt mehr PV-Ueberschuss an, wird
             er mitgenommen statt eingespeist (FIX 2026-11: beim Preis-Netzladen
             mittags ging alles ueber 3 x manual ins Netz). Nachts ohne PV
             bleibt es exakt bei manual. charge_power haengt nicht von der
             Batterieleistung ab, -charge_power ist also der echte Ueberschuss. #}
          {% set ns = namespace(o=[], n=0) %}
          {% for i in range(3) %}
            {% if ctl[i] and (soc_raw[i] | float(0)) < 99.5 %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {% set pv_je = ([0, -(states('sensor.charge_power') | float(0))] | max) / ([ns.n, 1] | max) %}
          {% for i in range(3) %}
            {% set ok = ctl[i] and (soc_raw[i] | float(0)) < 99.5 %}
            {% set ns.o = ns.o + [([manual, pv_je] | max | round(0) | int(0)) if ok else 0] %}
          {% endfor %}
          {{ {'v1': ns.o[0], 'v2': ns.o[1], 'v3': ns.o[2]} }}
        {% else %}
          {# Preissteuerung: bei hoher Einspeiseverguetung PV-Ueberschuss
             lieber einspeisen als speichern -> Ladeanforderung auf 0. #}
          {% set kein_laden = is_state('binary_sensor.einspeisen_besser_als_speichern', 'on') %}
          {% set total = 0 if kein_laden else [0, -(states('sensor.charge_power') | float(0))] | max | round(0) | int(0) %}
          {% set dyn_soc = states('sensor.target_soc') | float(60) %}
          {% set lims = [limits_map.get('v1', 2500), limits_map.get('v2', 2500), limits_map.get('v3', 2500)]
                        if limits_map is mapping else [2500, 2500, 2500] %}

          {# Gewicht 0 fuer Speicher ohne Steuermodus und fuer Speicher, deren
             HARDWARE-SOC voll meldet (FIX 2026-11). Bei target_soc > 100
             (100.5, 101, 120, 13x) bekamen beide vorher dyn_soc - 100 > 0, und
             der Mindest-Sollwert hob sie auf 200/500 W - Leistung, die keiner
             aufnimmt und die ins Netz ging. Hardware- statt Custom-SOC, damit
             Override/Wartung weiterladen, bis die Hardware wirklich voll ist. #}
          {% set hw = [
               states('sensor.marstek_venus_1_soc'),
               states('sensor.marstek_venus_2_soc'),
               states('sensor.marstek_venus_3_soc')
             ] %}
          {% set nsw = namespace(socs=[], ws=[]) %}
          {% for i in range(3) %}
            {% set s = (soc_raw[i] | float(100)) if ctl[i] else 100 %}
            {% set voll = (hw[i] | float(0)) >= 99.5 %}
            {% set nsw.socs = nsw.socs + [s] %}
            {% set nsw.ws = nsw.ws + [0 if (voll or not ctl[i]) else [dyn_soc - s, 0] | max] %}
          {% endfor %}
          {% set socs = nsw.socs %}
          {% set ws = nsw.ws %}
          {% set sum_w = ws | sum %}
          {% set n_act = ws | select('gt', 0) | list | count %}

          {% if sum_w == 0 or total <= 0 %}
            {{ {'v1': 0, 'v2': 0, 'v3': 0} }}
          {% else %}
            {% set floor = 500 if total > 500 * n_act else (200 if total > 200 * n_act else 0) %}

            {% if floor == 0 %}
              {# Zu wenig Leistung fuer mehrere sinnvolle Sollwerte:
                 alles an den Speicher mit dem groessten Bedarf; bei
                 nahezu gleichem Bedarf reihum. #}
              {% set w_max = ws | max %}
              {% set nsc = namespace(c=[]) %}
              {% for i in range(3) %}
                {% if ws[i] > 0 and (w_max - ws[i]) <= 10 %}
                  {% set nsc.c = nsc.c + [i] %}
                {% endif %}
              {% endfor %}
              {% set pick = nsc.c[(now().weekday() + now().hour) % (nsc.c | count)] %}
              {% set nsp = namespace(t=[]) %}
              {% for i in range(3) %}
                {% set nsp.t = nsp.t + [total if i == pick else 0] %}
              {% endfor %}
              {% set t_bal = nsp.t %}
            {% else %}
              {# proportionale Rohverteilung #}
              {% set nsr = namespace(t=[]) %}
              {% for i in range(3) %}
                {% set nsr.t = nsr.t + [ws[i] / sum_w * total] %}
              {% endfor %}
              {% set t_raw = nsr.t %}

              {# Mindest-Sollwert je aktivem Speicher, Gegenbuchung bei den
                 groesseren Werten. total > n_act * floor garantiert, dass
                 der Ueberhang gross genug ist. #}
              {% set nsd = namespace(deficit=0, excess=0) %}
              {% for i in range(3) %}
                {% if ws[i] > 0 %}
                  {% if t_raw[i] < floor %}
                    {% set nsd.deficit = nsd.deficit + (floor - t_raw[i]) %}
                  {% else %}
                    {% set nsd.excess = nsd.excess + (t_raw[i] - floor) %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set nsb = namespace(t=[]) %}
              {% for i in range(3) %}
                {% if ws[i] <= 0 %}
                  {% set nsb.t = nsb.t + [0] %}
                {% elif t_raw[i] < floor %}
                  {% set nsb.t = nsb.t + [floor] %}
                {% elif nsd.excess > 0 %}
                  {% set nsb.t = nsb.t + [t_raw[i] - ((t_raw[i] - floor) / nsd.excess * nsd.deficit)] %}
                {% else %}
                  {% set nsb.t = nsb.t + [t_raw[i]] %}
                {% endif %}
              {% endfor %}
              {% set t_bal = nsb.t %}
            {% endif %}

            {# Deckel + Umverteilung des abgeschnittenen Rests. #}
            {% set nsl = namespace(t=t_bal) %}
            {% for p in range(2) %}
              {% set nsc2 = namespace(cap=[], surplus=0, head=0) %}
              {% for i in range(3) %}
                {% set v = [nsl.t[i], lims[i]] | min %}
                {% set nsc2.cap = nsc2.cap + [v] %}
                {% set nsc2.surplus = nsc2.surplus + (nsl.t[i] - v) %}
                {% if socs[i] < 100 and ws[i] > 0 %}
                  {% set nsc2.head = nsc2.head + (lims[i] - v) %}
                {% endif %}
              {% endfor %}
              {% set nsn = namespace(t=[]) %}
              {% for i in range(3) %}
                {% if nsc2.head > 0 and nsc2.surplus > 0 and socs[i] < 100 and ws[i] > 0 %}
                  {% set nsn.t = nsn.t + [nsc2.cap[i] + ((lims[i] - nsc2.cap[i]) / nsc2.head * nsc2.surplus)] %}
                {% else %}
                  {% set nsn.t = nsn.t + [nsc2.cap[i]] %}
                {% endif %}
              {% endfor %}
              {% set nsl.t = nsn.t %}
            {% endfor %}

            {% set nso = namespace(o=[]) %}
            {% for i in range(3) %}
              {% set nso.o = nso.o + [[nsl.t[i], lims[i]] | min | round(0) | int(0)] %}
            {% endfor %}
            {{ {'v1': nso.o[0], 'v2': nso.o[1], 'v3': nso.o[2]} }}
          {% endif %}
        {% endif %}

      # ---------------------------------------------------------------
      # ENTLADEVERTEILUNG
      # Gleiche Struktur wie charge_map, mit festem Deckel 2500 W je Venus
      # samt Umverteilung des Rests und der zusaetzlichen Zellenspannungs-
      # Sperre. floor = 250 W je Geraet, aktiv ab 250 * n_aktiv Gesamtleistung.
      # ---------------------------------------------------------------
      discharge_map: >-
        {% set raw = states('sensor.charge_power') | float(0) %}
        {% set zero = {'v1': 0, 'v2': 0, 'v3': 0} %}
        {# Preissteuerung: Entladen lohnt nicht, wenn die Verguetung ueber
           dem vermiedenen Bezugspreis liegt. #}
        {% set kein_entladen = is_state('binary_sensor.entladen_sperren', 'on') %}
        {% set total = 0 if kein_entladen else [raw, 0] | max | round(0) | int(0) %}

        {% if total > 0 %}
          {% set min_soc = state_attr('sensor.solar_soc_logic', 'min') | float(15) %}
          {% set min_v = state_attr('sensor.global_parameter', 'lfp_min_voltage') | float(2.90) %}

          {% set ctl = [
               is_state('switch.marstek_venus_1_modbus_rs485_steuermodus', 'on') and is_state('binary_sensor.venus_1_vorhanden', 'on'),
               is_state('switch.marstek_venus_2_modbus_rs485_steuermodus', 'on') and is_state('binary_sensor.venus_2_vorhanden', 'on'),
               is_state('switch.marstek_venus_3_modbus_rs485_steuermodus', 'on') and is_state('binary_sensor.venus_3_vorhanden', 'on')
             ] %}
          {% set cell = [
               states('sensor.marstek_venus_1_modbus_minimale_zellenspannung') | float(0),
               states('sensor.marstek_venus_2_modbus_minimale_zellenspannung') | float(0),
               states('sensor.marstek_venus_3_modbus_minimale_zellenspannung') | float(0)
             ] %}
          {% set socs = [
               states('sensor.venus_1_custom_soc') | float(0),
               states('sensor.venus_2_custom_soc') | float(0),
               states('sensor.venus_3_custom_soc') | float(0)
             ] %}

          {% set nsw = namespace(ws=[]) %}
          {% for i in range(3) %}
            {% set w = ([socs[i] - min_soc, 0] | max) if (ctl[i] and cell[i] >= min_v) else 0 %}
            {% set nsw.ws = nsw.ws + [w] %}
          {% endfor %}
          {% set ws = nsw.ws %}
          {% set sum_w = ws | sum %}
          {% set n_act = ws | select('gt', 0) | list | count %}

          {% if sum_w == 0 %}
            {{ zero }}
          {% else %}
            {% set floor = 250 if total > 250 * n_act else 0 %}

            {% if floor == 0 %}
              {% set w_max = ws | max %}
              {% set nsc = namespace(c=[]) %}
              {% for i in range(3) %}
                {% if ws[i] > 0 and (w_max - ws[i]) <= 10 %}
                  {% set nsc.c = nsc.c + [i] %}
                {% endif %}
              {% endfor %}
              {% set pick = nsc.c[(now().weekday() + now().hour) % (nsc.c | count)] %}
              {% set nsp = namespace(o=[]) %}
              {% for i in range(3) %}
                {% set nsp.o = nsp.o + [total if i == pick else 0] %}
              {% endfor %}
              {{ {'v1': nsp.o[0], 'v2': nsp.o[1], 'v3': nsp.o[2]} }}
            {% else %}
              {% set nsr = namespace(t=[]) %}
              {% for i in range(3) %}
                {% set nsr.t = nsr.t + [ws[i] / sum_w * total] %}
              {% endfor %}
              {% set t_raw = nsr.t %}

              {% set nsd = namespace(deficit=0, excess=0) %}
              {% for i in range(3) %}
                {% if ws[i] > 0 %}
                  {% if t_raw[i] < floor %}
                    {% set nsd.deficit = nsd.deficit + (floor - t_raw[i]) %}
                  {% else %}
                    {% set nsd.excess = nsd.excess + (t_raw[i] - floor) %}
                  {% endif %}
                {% endif %}
              {% endfor %}

              {% set nso = namespace(o=[]) %}
              {% for i in range(3) %}
                {% if ws[i] <= 0 %}
                  {% set nso.o = nso.o + [0] %}
                {% elif t_raw[i] < floor %}
                  {% set nso.o = nso.o + [floor | round(0) | int(0)] %}
                {% elif nsd.excess > 0 %}
                  {% set nso.o = nso.o + [(t_raw[i] - ((t_raw[i] - floor) / nsd.excess * nsd.deficit)) | round(0) | int(0)] %}
                {% else %}
                  {% set nso.o = nso.o + [t_raw[i] | round(0) | int(0)] %}
                {% endif %}
              {% endfor %}
              {# Deckel 2500 W je Venus, den abgeschnittenen Rest auf die
                 Speicher mit Luft verteilen - wie in charge_map (FIX 2026-11).
                 Vorher kappte erst die Sende-Automation und der Rest kam aus
                 dem Netz: SOC 70/50/30 % bei 7,2 kW -> 2500/2400/1029 W. #}
              {% set lim = 2500 %}
              {% set nsl = namespace(t=nso.o) %}
              {% for p in range(2) %}
                {% set nsc = namespace(cap=[], over=0, head=0) %}
                {% for i in range(3) %}
                  {% set v = [nsl.t[i], lim] | min %}
                  {% set nsc.cap = nsc.cap + [v] %}
                  {% set nsc.over = nsc.over + (nsl.t[i] - v) %}
                  {% if ws[i] > 0 %}{% set nsc.head = nsc.head + (lim - v) %}{% endif %}
                {% endfor %}
                {% set nsn = namespace(t=[]) %}
                {% for i in range(3) %}
                  {% if nsc.head > 0 and nsc.over > 0 and ws[i] > 0 %}
                    {% set nsn.t = nsn.t + [nsc.cap[i] + (lim - nsc.cap[i]) / nsc.head * nsc.over] %}
                  {% else %}
                    {% set nsn.t = nsn.t + [nsc.cap[i]] %}
                  {% endif %}
                {% endfor %}
                {% set nsl.t = nsn.t %}
              {% endfor %}
              {% set o = nsl.t | map('round', 0) | map('int') | list %}
              {{ {'v1': [o[0], lim] | min, 'v2': [o[1], lim] | min, 'v3': [o[2], lim] | min} }}
            {% endif %}
          {% endif %}
        {% else %}
          {{ zero }}
        {% endif %}

    sensor:
      - name: "Target Power Distribution fast"
        unique_id: target_power_distribution_fast
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set c_total = (charge_map.get('v1', 0) + charge_map.get('v2', 0) + charge_map.get('v3', 0)) if charge_map is mapping else 0 %}
          {% set d_total = (discharge_map.get('v1', 0) + discharge_map.get('v2', 0) + discharge_map.get('v3', 0)) if discharge_map is mapping else 0 %}
          {{ (c_total - d_total) | round(0) | int(0) }}
        attributes:
          charge: "{{ charge_map }}"
          discharge: "{{ discharge_map }}"

      - name: "Max Charge Limits"
        unique_id: max_charge_limits
        unit_of_measurement: "W"
        state_class: measurement
        state: >-
          {{ (limits_map.get('v1', 0) + limits_map.get('v2', 0) + limits_map.get('v3', 0)) | round(0) | int(0) if limits_map is mapping else 0 }}
        attributes:
          limits: "{{ limits_map }}"

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.venus_1_custom_soc
          - sensor.venus_2_custom_soc
          - sensor.venus_3_custom_soc
    sensor:
      - name: "Venus 1 Time until 80"
        unique_id: venus_1_time_until_80
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:battery-clock
        state: >-
          {% from 'soc_macros.jinja' import time_until %}
          {{ time_until(1, 80) }}
        attributes:
          eta: >-
            {% from 'soc_macros.jinja' import time_until_eta %}
            {{ time_until_eta(1, 80) }}

      - name: "Venus 1 Time until 100"
        unique_id: venus_1_time_until_100
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:battery-clock
        state: >-
          {% from 'soc_macros.jinja' import time_until %}
          {{ time_until(1, 100) }}
        attributes:
          eta: >-
            {% from 'soc_macros.jinja' import time_until_eta %}
            {{ time_until_eta(1, 100) }}

      - name: "Venus 2 Time until 80"
        unique_id: venus_2_time_until_80
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:battery-clock
        state: >-
          {% from 'soc_macros.jinja' import time_until %}
          {{ time_until(2, 80) }}
        attributes:
          eta: >-
            {% from 'soc_macros.jinja' import time_until_eta %}
            {{ time_until_eta(2, 80) }}

      - name: "Venus 2 Time until 100"
        unique_id: venus_2_time_until_100
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:battery-clock
        state: >-
          {% from 'soc_macros.jinja' import time_until %}
          {{ time_until(2, 100) }}
        attributes:
          eta: >-
            {% from 'soc_macros.jinja' import time_until_eta %}
            {{ time_until_eta(2, 100) }}

      - name: "Venus 3 Time until 80"
        unique_id: venus_3_time_until_80
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:battery-clock
        state: >-
          {% from 'soc_macros.jinja' import time_until %}
          {{ time_until(3, 80) }}
        attributes:
          eta: >-
            {% from 'soc_macros.jinja' import time_until_eta %}
            {{ time_until_eta(3, 80) }}

      - name: "Venus 3 Time until 100"
        unique_id: venus_3_time_until_100
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:battery-clock
        state: >-
          {% from 'soc_macros.jinja' import time_until %}
          {{ time_until(3, 100) }}
        attributes:
          eta: >-
            {% from 'soc_macros.jinja' import time_until_eta %}
            {{ time_until_eta(3, 100) }}

  - sensor:
      - name: "Battery SOC Total"
        unique_id: battery_soc_total
        unit_of_measurement: "%"
        device_class: battery
        # Mittelwert ueber die VORHANDENEN Speicher (2026-11-13); Custom-SOC
        # bevorzugt, Hardware-SOC als Rueckfall, wenn gar kein Custom-SOC
        # lesbar ist. (Ungewichtet - alle haben dieselbe Nennkapazitaet.)
        state: >-
          {% set ns = namespace(c=[], h=[]) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% set c = states('sensor.venus_' ~ i ~ '_custom_soc') %}
            {% set h = states('sensor.marstek_venus_' ~ i ~ '_soc') %}
            {% if is_number(c) %}{% set ns.c = ns.c + [c | float] %}{% endif %}
            {% if is_number(h) %}{% set ns.h = ns.h + [h | float] %}{% endif %}
          {% endfor %}
          {% set l = ns.c if ns.c | count > 0 else ns.h %}
          {{ (l | sum / (l | count)) | round(0) | int(0) if l | count > 0 else 0 }}
        availability: >-
          {% set ns = namespace(n=0) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% if is_number(states('sensor.venus_' ~ i ~ '_custom_soc'))
                  or is_number(states('sensor.marstek_venus_' ~ i ~ '_soc')) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n > 0 }}

      - name: "Marstek AC Power Total"
        unique_id: marstek_ac_power_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # Summe ueber die VORHANDENEN Speicher (2026-11-13). Fehlt ein
        # vorhandener, bleibt der Sensor wie bisher unavailable.
        state: >-
          {% set ns = namespace(sum=0) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% set ns.sum = ns.sum + states('sensor.marstek_venus_' ~ i ~ '_ac_power') | float(0) %}
          {% endfor %}
          {{ ns.sum | round(0) }}
        availability: >-
          {% set ns = namespace(n=0, ok=true) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% set ns.n = ns.n + 1 %}
            {% if not is_number(states('sensor.marstek_venus_' ~ i ~ '_ac_power')) %}{% set ns.ok = false %}{% endif %}
          {% endfor %}
          {{ ns.ok and ns.n > 0 }}

      - name: "Marstek DC Power Total"
        unique_id: marstek_dc_power_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set ns = namespace(sum=0) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% set ns.sum = ns.sum + states('sensor.marstek_venus_' ~ i ~ '_batterieleistung') | float(0) %}
          {% endfor %}
          {{ (-ns.sum) | round(0) }}
        availability: >-
          {% set ns = namespace(n=0, ok=true) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% set ns.n = ns.n + 1 %}
            {% if not is_number(states('sensor.marstek_venus_' ~ i ~ '_batterieleistung')) %}{% set ns.ok = false %}{% endif %}
          {% endfor %}
          {{ ns.ok and ns.n > 0 }}

      - name: "Venus 1 Energy Wh"
        unique_id: venus_1_energy_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        state: >
          {# Riemann liefert kWh -> * 1000 = Wh. Offset von 50000 dazu.
             Keine Begrenzung auf 0...100000 mehr (2026-11, gilt fuer alle
             drei): der Riemann-Zaehler laeuft unbegrenzt weiter und driftet.
             An einer Grenze waere der Wert eingefroren und mit ihm der
             Custom-SOC - Venus 3 stand Anfang November schon bei ~23 200. #}
          {% set val = (states('sensor.venus_1_riemann') | float(0) * (-1000)) + 50000 %}
          {{ val | round(1) }}

      - name: "Venus 2 Energy Wh"
        unique_id: venus_2_energy_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        state: >
          {% set val = (states('sensor.venus_2_riemann') | float(0) * (-1000)) + 50000 %}
          {{ val | round(1) }}

      - name: "Venus 3 Energy Wh"
        unique_id: venus_3_energy_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        state: >
          {% set val = (states('sensor.venus_3_riemann') | float(0) * (-1000)) + 50000 %}
          {{ val | round(1) }}

    # PRAESENZ je Venus (NEU 2026-11-13)
    #
    # "nicht vorhanden" = SOC seit 15 min durchgehend unavailable oder
    # eingefroren (last_reported aelter als 300 s). Erst dann faellt der
    # Speicher aus Watchdog, Summen, Verteilung und Wartungslogik heraus.
    # Kurze Aussetzer (Coordinator-Pause 180 s) schlagen wie bisher im
    # Watchdog an. Kommt der Speicher zurueck, ist er sofort wieder dabei.
    # Der Zustand wird bei Neustarts wiederhergestellt.
    #
    # WATCHDOG: liefert die Marstek-Integration gerade gueltige Werte?
    #
    # Der Coordinator pausiert nach einem Lesefehler 180 s. In dieser Zeit
    # stehen die Entitaeten je nach Fehlerbild auf "unavailable" ODER sie
    # behalten einfach ihren letzten Wert. Beide Faelle werden hier erkannt:
    #   has_value      -> deckt "unavailable"/"unknown" ab (sofort)
    #   last_reported  -> deckt eingefrorene Werte ab (nach max_age)
    #
    # Geprueft werden nur VORHANDENE Speicher (2026-11-13). Vorher blieb der
    # Watchdog ohne Venus 3 dauerhaft aus -> charge_power unavailable ->
    # die anderen beiden luden nicht.
    #
    # Gelesen von: ev_sensor_trigger.yaml (Ueberschussrechnung),
    #              consumption.yaml (sensor.charge_power),
    # Alle drei rechneten fehlende Marstek-Leistung vorher als 0 W - beim
    # Ausfall sah die Wallbox dadurch bis zu 7,5 kW Ueberschuss zu viel und
    # lud aus dem Netz.
    #
    # delay_on: nach einer Stoerung erst wieder vertrauen, wenn die Daten
    # 20 s stabil da sind. Ausschalten ohne Verzoegerung - im Zweifel lieber
    # eine Regelung zu frueh einfrieren als zu spaet.

  - binary_sensor:
      - name: "Venus 1 vorhanden"
        unique_id: venus_1_vorhanden
        device_class: connectivity
        delay_off: "00:15:00"
        state: >-
          {% set e = 'sensor.marstek_venus_1_soc' %}
          {% set s = states[e] %}
          {{ s is not none and has_value(e) and
             (now() - (s.last_reported if s.last_reported is defined else s.last_updated)).total_seconds() < 300 }}

      - name: "Venus 2 vorhanden"
        unique_id: venus_2_vorhanden
        device_class: connectivity
        delay_off: "00:15:00"
        state: >-
          {% set e = 'sensor.marstek_venus_2_soc' %}
          {% set s = states[e] %}
          {{ s is not none and has_value(e) and
             (now() - (s.last_reported if s.last_reported is defined else s.last_updated)).total_seconds() < 300 }}

      - name: "Venus 3 vorhanden"
        unique_id: venus_3_vorhanden
        device_class: connectivity
        delay_off: "00:15:00"
        state: >-
          {% set e = 'sensor.marstek_venus_3_soc' %}
          {% set s = states[e] %}
          {{ s is not none and has_value(e) and
             (now() - (s.last_reported if s.last_reported is defined else s.last_updated)).total_seconds() < 300 }}

      - name: "Marstek available"
        unique_id: marstek_available
        device_class: connectivity
        icon: mdi:lan-connect
        delay_on: "00:00:20"
        state: >-
          {% set max_age = 300 %}
          {% set ns = namespace(ok=true, n=0) %}
          {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
            {% set ns.n = ns.n + 1 %}
            {% for e in ['sensor.marstek_venus_' ~ i ~ '_ac_power', 'sensor.marstek_venus_' ~ i ~ '_soc'] %}
              {% set s = states[e] %}
              {% if s is none or not has_value(e) %}
                {% set ns.ok = false %}
              {% else %}
                {% set ts = s.last_reported if s.last_reported is defined else s.last_updated %}
                {% if (now() - ts).total_seconds() > max_age %}{% set ns.ok = false %}{% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.ok and ns.n > 0 }}
        attributes:
          stale_entities: >-
            {% set ns = namespace(l=[]) %}
            {% for i in [1, 2, 3] if is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
              {% set ns.l = ns.l + ['sensor.marstek_venus_' ~ i ~ '_ac_power', 'sensor.marstek_venus_' ~ i ~ '_soc'] %}
            {% endfor %}
            {{ ns.l | reject('has_value') | list | join(', ') }}
          nicht_vorhanden: >-
            {% set ns = namespace(l=[]) %}
            {% for i in [1, 2, 3] if not is_state('binary_sensor.venus_' ~ i ~ '_vorhanden', 'on') %}
              {% set ns.l = ns.l + ['Venus ' ~ i] %}
            {% endfor %}
            {{ ns.l | join(', ') }}

automation:
  - alias: "Sende Lade und Entladebefehle an Hardware"
    id: "sende_batterie_targets_v4"
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: sensor.target_power_distribution_fast
      - trigger: state
        entity_id:
          - input_boolean.override_soc
          - input_number.manual_charge_power
    actions:
      - variables:
          c: >-
            {% set raw = state_attr('sensor.target_power_distribution_fast', 'charge') %}
            {{ raw if raw is mapping else {'v1': 0, 'v2': 0, 'v3': 0} }}
          d: >-
            {% set raw = state_attr('sensor.target_power_distribution_fast', 'discharge') %}
            {{ raw if raw is mapping else {'v1': 0, 'v2': 0, 'v3': 0} }}

          c1: "{{ c.get('v1', 0) | int(0) }}"
          d1: "{{ d.get('v1', 0) | int(0) }}"
          c2: "{{ c.get('v2', 0) | int(0) }}"
          d2: "{{ d.get('v2', 0) | int(0) }}"
          c3: "{{ c.get('v3', 0) | int(0) }}"
          d3: "{{ d.get('v3', 0) | int(0) }}"

          direction: >-
            {% set c_tot = c1 + c2 + c3 %}
            {% set d_tot = d1 + d2 + d3 %}
            {{ 'charge' if c_tot >= 20 and c_tot >= d_tot else ('discharge' if d_tot >= 20 else 'standby') }}

          v1_charge: "{{ [c1, 2500] | min if direction == 'charge' and c1 >= 20 else 0 }}"
          v2_charge: "{{ [c2, 2500] | min if direction == 'charge' and c2 >= 20 else 0 }}"
          v3_charge: "{{ [c3, 2500] | min if direction == 'charge' and c3 >= 20 else 0 }}"
          v1_discharge: "{{ [d1, 2500] | min if direction == 'discharge' and d1 >= 20 else 0 }}"
          v2_discharge: "{{ [d2, 2500] | min if direction == 'discharge' and d2 >= 20 else 0 }}"
          v3_discharge: "{{ [d3, 2500] | min if direction == 'discharge' and d3 >= 20 else 0 }}"

          target_mode_v1: "{{ 'charge' if v1_charge > 0 else ('discharge' if v1_discharge > 0 else 'standby') }}"
          target_mode_v2: "{{ 'charge' if v2_charge > 0 else ('discharge' if v2_discharge > 0 else 'standby') }}"
          target_mode_v3: "{{ 'charge' if v3_charge > 0 else ('discharge' if v3_discharge > 0 else 'standby') }}"

          leaving_v1: >-
            {{ states('select.marstek_venus_1_force_mode') in ['charge', 'discharge']
               and states('select.marstek_venus_1_force_mode') != target_mode_v1 }}
          leaving_v2: >-
            {{ states('select.marstek_venus_2_force_mode') in ['charge', 'discharge']
               and states('select.marstek_venus_2_force_mode') != target_mode_v2 }}
          leaving_v3: >-
            {{ states('select.marstek_venus_3_force_mode') in ['charge', 'discharge']
               and states('select.marstek_venus_3_force_mode') != target_mode_v3 }}

      - if:
          - condition: template
            value_template: "{{ leaving_v1 or leaving_v2 or leaving_v3 }}"
        then:
          - parallel:
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ leaving_v1 }}"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ states('number.marstek_venus_1_charge_power') | float(0) != 0 }}"
                        then:
                          - action: number.set_value
                            target:
                              entity_id: number.marstek_venus_1_charge_power
                            data: { value: 0 }
                            continue_on_error: true
                          - delay: { milliseconds: 120 }
                      - if:
                          - condition: template
                            value_template: "{{ states('number.marstek_venus_1_discharge_power') | float(0) != 0 }}"
                        then:
                          - action: number.set_value
                            target:
                              entity_id: number.marstek_venus_1_discharge_power
                            data: { value: 0 }
                            continue_on_error: true
              - sequence:
                  - delay: { milliseconds: 10 }
                  - if:
                      - condition: template
                        value_template: "{{ leaving_v2 }}"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ states('number.marstek_venus_2_charge_power') | float(0) != 0 }}"
                        then:
                          - action: number.set_value
                            target:
                              entity_id: number.marstek_venus_2_charge_power
                            data: { value: 0 }
                            continue_on_error: true
                          - delay: { milliseconds: 120 }
                      - if:
                          - condition: template
                            value_template: "{{ states('number.marstek_venus_2_discharge_power') | float(0) != 0 }}"
                        then:
                          - action: number.set_value
                            target:
                              entity_id: number.marstek_venus_2_discharge_power
                            data: { value: 0 }
                            continue_on_error: true
              - sequence:
                  - delay: { milliseconds: 20 }
                  - if:
                      - condition: template
                        value_template: "{{ leaving_v3 }}"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ states('number.marstek_venus_3_charge_power') | float(0) != 0 }}"
                        then:
                          - action: number.set_value
                            target:
                              entity_id: number.marstek_venus_3_charge_power
                            data: { value: 0 }
                            continue_on_error: true
                          - delay: { milliseconds: 120 }
                      - if:
                          - condition: template
                            value_template: "{{ states('number.marstek_venus_3_discharge_power') | float(0) != 0 }}"
                        then:
                          - action: number.set_value
                            target:
                              entity_id: number.marstek_venus_3_discharge_power
                            data: { value: 0 }
                            continue_on_error: true
          - delay: { milliseconds: 120 }

      - parallel:
          - sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('select.marstek_venus_1_force_mode') != target_mode_v1 }}"
                then:
                  - action: select.select_option
                    target: { entity_id: select.marstek_venus_1_force_mode }
                    data: { option: "{{ target_mode_v1 }}" }
                  - delay: { milliseconds: 120 }

              - if:
                  - condition: template
                    value_template: >-
                      {{ (states('number.marstek_venus_1_charge_power') | float(-1)) | round(0) | int(0) != v1_charge }}
                then:
                  - action: number.set_value
                    target: { entity_id: number.marstek_venus_1_charge_power }
                    data: { value: "{{ v1_charge }}" }
                    continue_on_error: true
                  - delay: { milliseconds: 120 }

              - if:
                  - condition: template
                    value_template: >-
                      {{ (states('number.marstek_venus_1_discharge_power') | float(-1)) | round(0) | int(0) != v1_discharge }}
                then:
                  - action: number.set_value
                    target:
                      { entity_id: number.marstek_venus_1_discharge_power }
                    data: { value: "{{ v1_discharge }}" }
                    continue_on_error: true

          - sequence:
              - delay: { milliseconds: 10 }
              - if:
                  - condition: template
                    value_template: "{{ states('select.marstek_venus_2_force_mode') != target_mode_v2 }}"
                then:
                  - action: select.select_option
                    target: { entity_id: select.marstek_venus_2_force_mode }
                    data: { option: "{{ target_mode_v2 }}" }
                  - delay: { milliseconds: 120 }

              - if:
                  - condition: template
                    value_template: >-
                      {{ (states('number.marstek_venus_2_charge_power') | float(-1)) | round(0) | int(0) != v2_charge }}
                then:
                  - action: number.set_value
                    target: { entity_id: number.marstek_venus_2_charge_power }
                    data: { value: "{{ v2_charge }}" }
                    continue_on_error: true
                  - delay: { milliseconds: 120 }

              - if:
                  - condition: template
                    value_template: >-
                      {{ (states('number.marstek_venus_2_discharge_power') | float(-1)) | round(0) | int(0) != v2_discharge }}
                then:
                  - action: number.set_value
                    target:
                      { entity_id: number.marstek_venus_2_discharge_power }
                    data: { value: "{{ v2_discharge }}" }
                    continue_on_error: true

          - sequence:
              - delay: { milliseconds: 20 }
              - if:
                  - condition: template
                    value_template: "{{ states('select.marstek_venus_3_force_mode') != target_mode_v3 }}"
                then:
                  - action: select.select_option
                    target: { entity_id: select.marstek_venus_3_force_mode }
                    data: { option: "{{ target_mode_v3 }}" }
                  - delay: { milliseconds: 120 }

              - if:
                  - condition: template
                    value_template: >-
                      {{ (states('number.marstek_venus_3_charge_power') | float(-1)) | round(0) | int(0) != v3_charge }}
                then:
                  - action: number.set_value
                    target: { entity_id: number.marstek_venus_3_charge_power }
                    data: { value: "{{ v3_charge }}" }
                    continue_on_error: true
                  - delay: { milliseconds: 120 }

              - if:
                  - condition: template
                    value_template: >-
                      {{ (states('number.marstek_venus_3_discharge_power') | float(-1)) | round(0) | int(0) != v3_discharge }}
                then:
                  - action: number.set_value
                    target:
                      { entity_id: number.marstek_venus_3_discharge_power }
                    data: { value: "{{ v3_discharge }}" }
                    continue_on_error: true
      - delay: { milliseconds: 400 }

  - alias: "Marstek: Zeitstempel Batterie voll aktualisieren"
    id: marstek_set_last_full_timestamp
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.marstek_venus_1_soc
          - sensor.marstek_venus_2_soc
          - sensor.marstek_venus_3_soc
        above: 99.5
        for: "00:00:10"
        id: "sensor_update"
      - trigger: time_pattern
        minutes: "/10"
        id: "timer_update"

    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: "sensor_update"
            sequence:
              - variables:
                  device_id: "{{ trigger.entity_id.split('_')[2] }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: "input_datetime.venus_{{ device_id }}_last_full"
                data:
                  timestamp: "{{ now().timestamp() }}"
              - action: number.set_value
                target:
                  entity_id: "number.marstek_venus_{{ device_id }}_charge_power"
                data:
                  value: 0
                continue_on_error: true

          - conditions:
              - condition: trigger
                id: "timer_update"
            sequence:
              - repeat:
                  for_each:
                    - num: "1"
                      ent: sensor.marstek_venus_1_soc
                    - num: "2"
                      ent: sensor.marstek_venus_2_soc
                    - num: "3"
                      ent: sensor.marstek_venus_3_soc
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ states(repeat.item.ent) | float(0) > 99.5 }}"
                      then:
                        - action: input_datetime.set_datetime
                          target:
                            entity_id: "input_datetime.venus_{{ repeat.item.num }}_last_full"
                          data:
                            timestamp: "{{ now().timestamp() }}"
                        - action: number.set_value
                          target:
                            entity_id: "number.marstek_venus_{{ repeat.item.num }}_charge_power"
                          data:
                            value: 0
                          continue_on_error: true

  - alias: "Marstek Venus: Ladeleistung zurücksetzen wenn SOC > Target"
    id: marstek_venus_reset_charge_over_target
    mode: queued
    max: 15
    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: state
        entity_id:
          - sensor.venus_1_custom_soc
          - sensor.venus_2_custom_soc
          - sensor.venus_3_custom_soc
          - sensor.target_soc

    actions:
      - variables:
          target: "{{ states('sensor.target_soc') | float(100) }}"

      - parallel:
          - sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {% set ladeleistung = states('number.marstek_venus_1_charge_power') | float(0) %}
                      {% set soc = states('sensor.venus_1_custom_soc') | float(0) %}
                      {{ ladeleistung != 0 and soc > target }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.marstek_venus_1_charge_power
                    data:
                      value: 0
                    continue_on_error: true

          - sequence:
              - delay: "00:00:00.20"
              - if:
                  - condition: template
                    value_template: >-
                      {% set ladeleistung = states('number.marstek_venus_2_charge_power') | float(0) %}
                      {% set soc = states('sensor.venus_2_custom_soc') | float(0) %}
                      {{ ladeleistung != 0 and soc > target }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.marstek_venus_2_charge_power
                    data:
                      value: 0
                    continue_on_error: true

          - sequence:
              - delay: "00:00:00.40"
              - if:
                  - condition: template
                    value_template: >-
                      {% set ladeleistung = states('number.marstek_venus_3_charge_power') | float(0) %}
                      {% set soc = states('sensor.venus_3_custom_soc') | float(0) %}
                      {{ ladeleistung != 0 and soc > target }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.marstek_venus_3_charge_power
                    data:
                      value: 0
                    continue_on_error: true

  # ==========================================================
  # WARTUNGSLADUNG VENUS
  #
  # Umgebaut: die Automation steuert jetzt NUR noch die Venus.
  #
  # Zusaetzlich time_pattern /30 als Trigger: der reine
  # "to: on"-Flankentrigger kam nicht wieder, weil der Binary Sensor
  # "on" BLEIBT. Ein abgebrochener Zyklus konnte damit fruehestens am
  # naechsten Abend erneut starten.
  #
  # Start und Stopp beruecksichtigen nur VORHANDENE Speicher (2026-11-13).
  # Vorher startete die Wartungsladung ohne Venus 3 jede Nacht und lief
  # bis Sonnenaufgang.
  #
  # ACHTUNG bei drei Speichern: 1000 W je Geraet sind jetzt 3 kW aus dem
  # Netz. Wenn das zu viel ist, den Wert hier reduzieren.
  # ==========================================================
  - alias: "Battery Maintenance: Start Venus Night Charge"
    id: battery_maintenance_night_charge
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "00:05:00"
      - trigger: time_pattern
        minutes: "/30"
    conditions:
      # "condition: sun / after: sunset" ist nur von Sonnenuntergang bis
      # Mitternacht wahr - danach lief der /30-Trigger ins Leere und ein
      # abgebrochener Zyklus konnte fruehestens am naechsten Abend neu
      # starten. below_horizon deckt die ganze Nacht ab; nach oben begrenzt
      # weiterhin "Hard stop at sunrise".
      - condition: template
        value_template: "{{ is_state('sun.sun', 'below_horizon') }}"
      # Nur starten, wenn wirklich ein VORHANDENER Venus ueberfaellig ist.
      - condition: template
        value_template: >-
          {% set days = state_attr('sensor.global_parameter', 'battery_care_days') | float(8) %}
          {% set now_ts = as_timestamp(now()) %}
          {% set ns = namespace(ages=[0]) %}
          {% for n in ['1', '2', '3'] if is_state('binary_sensor.venus_' ~ n ~ '_vorhanden', 'on') %}
            {% set e = 'input_datetime.venus_' ~ n ~ '_last_full' %}
            {% set ns.ages = ns.ages + [(now_ts - as_timestamp(states(e), now_ts)) if has_value(e) else 0] %}
          {% endfor %}
          {{ ns.ages | max > days * 86400 }}
      # Nicht neu setzen, wenn schon eine Ladung laeuft.
      - condition: numeric_state
        entity_id: input_number.manual_charge_power
        below: 1
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.manual_charge_power
        data:
          value: 1000.0
      - action: logbook.log
        data:
          name: "Battery Maintenance"
          message: "Venus-Wartungsladung gestartet (1000 W je Speicher)."

  - alias: "Battery Maintenance: Stop When Full"
    id: battery_maintenance_stop_when_full
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/10"
      - trigger: numeric_state
        entity_id:
          - sensor.marstek_venus_1_soc
          - sensor.marstek_venus_2_soc
          - sensor.marstek_venus_3_soc
        above: 99.5
    conditions:
      - condition: numeric_state
        entity_id: input_number.manual_charge_power
        above: 0
      # Alle VORHANDENEN Speicher voll (Hardware-SOC > 99.5).
      - condition: template
        value_template: >-
          {% set ns = namespace(all=true, n=0) %}
          {% for n in ['1', '2', '3'] if is_state('binary_sensor.venus_' ~ n ~ '_vorhanden', 'on') %}
            {% set ns.n = ns.n + 1 %}
            {% if states('sensor.marstek_venus_' ~ n ~ '_soc') | float(0) <= 99.5 %}{% set ns.all = false %}{% endif %}
          {% endfor %}
          {{ ns.all and ns.n > 0 }}
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.manual_charge_power
        data:
          value: 0

  # Harter Abbruch am Morgen. Ohne den haengt manual_charge_power bei
  # einer defekten Zelle, einem haengenden SOC-Sensor oder einem
  # Modbus-Aussetzer dauerhaft auf 1000 - die Venus wuerden dann rund um
  # die Uhr aus dem Netz laden.
  - alias: "Battery Maintenance: Hard stop at sunrise"
    id: battery_maintenance_hard_stop
    mode: single
    triggers:
      - trigger: sun
        event: sunrise
    conditions:
      - condition: numeric_state
        entity_id: input_number.manual_charge_power
        above: 0
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.manual_charge_power
        data:
          value: 0
      - action: logbook.log
        data:
          name: "Battery Maintenance"
          message: "Venus-Wartungsladung bei Sonnenaufgang hart beendet."

  # ==========================================================
  # OVERRIDE SOC
  #
  # EIN:  sobald ein vorhandener Speicher laenger als override_soc_days
  #       nicht voll war.
  # AUS:  erst, wenn JEDER vorhandene Speicher seit dem Einschalten
  #       mindestens einmal voll war (venus_X_last_full >= override_soc_since).
  #
  # Nicht vorhandene Speicher werden ignoriert (2026-11-13) - vorher blieb
  # override_soc ohne Venus 3 dauerhaft an.
  #
  # Der alte default-Zweig schaltete ab, sobald IRGENDEIN Speicher in den
  # letzten 30 min voll war - die anderen wurden dann nie fertig geladen.
  # Der Zweig "alle gleichzeitig 100 %" griff praktisch nie, weil ein voller
  # Speicher wieder auf 99 % absinkt, waehrend die anderen noch laden.
  #
  # mode: queued, damit der override_on-Trigger, den das eigene turn_on
  # ausloest, nicht als "Already running" verworfen wird.
  #
  # Achtung: erreicht ein vorhandener Speicher nie 100 % (Zelle, haengender
  # SOC), bleibt override_soc an - erkennbar an einem tagealten
  # input_datetime.override_soc_since.
  # ==========================================================
  - alias: "Battery Maintenance: Enable SOC Override When Overdue"
    description: >
      Schaltet override_soc ein, sobald ein vorhandener Speicher laenger als
      override_soc_days nicht voll war. Aus geht er erst, wenn JEDER
      vorhandene Speicher seit dem Einschalten mindestens einmal voll war
      (venus_X_last_full >= override_soc_since).
    id: soc_override_weekly_control
    mode: queued
    max: 5
    triggers:
      - trigger: time_pattern
        minutes: "/10"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.override_soc
        to: "on"
        id: override_on
      - trigger: state
        entity_id:
          - input_datetime.venus_1_last_full
          - input_datetime.venus_2_last_full
          - input_datetime.venus_3_last_full
          - binary_sensor.venus_1_vorhanden
          - binary_sensor.venus_2_vorhanden
          - binary_sensor.venus_3_vorhanden
    actions:
      - choose:
          # --- Startzeitpunkt merken: bei manuellem Einschalten oder
          #     falls der Helper noch nie gesetzt wurde ---
          - conditions:
              - condition: state
                entity_id: input_boolean.override_soc
                state: "on"
              - condition: template
                value_template: >-
                  {{ trigger.id == 'override_on'
                     or as_timestamp(states('input_datetime.override_soc_since'), 0) < 1000000000 }}
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.override_soc_since
                data:
                  timestamp: "{{ now().timestamp() }}"

          # --- AUS: jeder vorhandene Speicher war seit dem Einschalten voll ---
          - conditions:
              - condition: state
                entity_id: input_boolean.override_soc
                state: "on"
              - condition: template
                value_template: >-
                  {% set since = as_timestamp(states('input_datetime.override_soc_since'), 0) %}
                  {% set ns = namespace(all = since > 1000000000) %}
                  {% for n in ['1', '2', '3'] if is_state('binary_sensor.venus_' ~ n ~ '_vorhanden', 'on') %}
                    {% set t = as_timestamp(states('input_datetime.venus_' ~ n ~ '_last_full'), 0) %}
                    {% if t < since %}{% set ns.all = false %}{% endif %}
                  {% endfor %}
                  {{ ns.all }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.override_soc
              - action: logbook.log
                data:
                  name: "Battery Maintenance"
                  message: "override_soc aus - alle vorhandenen Venus waren seit dem Einschalten voll."

          # --- EIN: irgendein vorhandener Speicher ueberfaellig ---
          - conditions:
              - condition: state
                entity_id: input_boolean.override_soc
                state: "off"
              - condition: template
                value_template: >-
                  {% set days = state_attr('sensor.global_parameter', 'override_soc_days') | float(5) %}
                  {% set now_ts = as_timestamp(now()) %}
                  {% set ns = namespace(ages=[0]) %}
                  {% for n in ['1', '2', '3'] if is_state('binary_sensor.venus_' ~ n ~ '_vorhanden', 'on') %}
                    {% set e = 'input_datetime.venus_' ~ n ~ '_last_full' %}
                    {% set ns.ages = ns.ages + [(now_ts - as_timestamp(states(e), 0)) if has_value(e) else 0] %}
                  {% endfor %}
                  {{ ns.ages | max > days * 86400 }}
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.override_soc_since
                data:
                  timestamp: "{{ now().timestamp() }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.override_soc
