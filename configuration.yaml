# Base configuration
default_config:

frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  packages: !include_dir_named packages

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

shell_command:
  optimize_cpu: 'bash -c "echo schedutil > /sys/devices/system/cpu/cpufreq/policy0/scaling_governor && echo 10000 > /sys/devices/system/cpu/cpufreq/schedutil/rate_limit_us"'

rest_command:
  # AWEKAS-Upload. Stations-ID und Passwort standen frueher hier im
  # Klartext - beides liegt jetzt in secrets.yaml unter "awekas_url".
  #
  # Warum die KOMPLETTE URL ins Secret wandert und nicht nur die
  # Zugangsdaten: !secret ersetzt immer einen ganzen Wert, es laesst sich
  # nicht in eine Zeichenkette hineinschreiben. Templates wiederum
  # koennen keine Secrets lesen. Der Umweg funktioniert trotzdem, weil
  # !secret schon beim LADEN aufgeloest wird und die Template-Auswertung
  # erst beim AUFRUF passiert - die {% %}-Logik im Secret wird also ganz
  # normal gerendert. Der Aufruf selbst bleibt unveraendert:
  # rest_command.awekas_upload, ohne Parameter.
  #
  # Aufbau des Secrets (eine einzige Zeile, keine Umbrueche - ein
  # gefalteter Block wuerde Leerzeichen mitten in die URL setzen):
  #
  #   awekas_url: "{% set temp = states('sensor.wetterstation_aussentemperatur') %}{% set hum = states('sensor.wetterstation_luftfeuchtigkeit') %}{% if is_number(temp) and is_number(hum) %}https://ws.awekas.at/weatherstation/updateweatherstation.php?ID=<ID>&PASSWORD=<PW>&tempf={{ (temp | float * 9/5 + 32) | round(1) }}&humidity={{ hum | int }}&softwaretype=HomeAssistant{% else %}https://ws.awekas.at/weatherstation/updateweatherstation.php?ID=<ID>&PASSWORD=<PW>&status=offline{% endif %}"
  #
  awekas_upload:
    url: !secret awekas_url
    method: GET

recorder:
  purge_keep_days: 366
  commit_interval: 60
  # Benutzer und Passwort der MariaDB liegen jetzt in secrets.yaml
  db_url: !secret recorder_db_url

  exclude:
    entities:
      # - sensor.garage_inverter_energy_power
      # - sensor.balkon_inverter2_energy_power
      # - sensor.balkon_inverter_energy_power
      # - sensor.solarnet_leistung_vom_netz
      - sensor.remaining_pv_today
      - automation.sende_lade_und_entladebefehle_an_hardware

    entity_globs:
      - sensor.*defekt*
      - sensor.marstek_venus_*_spannung
      - sensor.marstek_venus_*_strom
      - sensor.*ssid*
      - sensor.*highest_peak_time*
      - sensor.*wifi_connect_count*
      - sensor.*raw*
      - sensor.*api*
      - sensor.*fast*
      - sensor.*apparentpower*
      - sensor.*reactivepower*
      - sensor.*umwandlungseffizienz*
      - sensor.*ac_frequenz*
      - sensor.*batteriestrom*
      - sensor.*autarkiegrad*
      - sensor.*batterieleistung
      - sensor.*energy_current*
      - sensor.*energy_voltage
      - sensor.*energy_factor*
      - sensor.*ant_bms*

command_line:
  - sensor:
      name: "CPU Current Speed"
      unique_id: cpu_current_speed_mhz
      command: "cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq"
      unit_of_measurement: "MHz"
      value_template: "{{ (value | float / 1000) | round(0) }}"
      scan_interval: 60

  - sensor:
      name: "CPU Maximum Speed"
      unique_id: cpu_max_speed_mhz
      command: "cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq"
      unit_of_measurement: "MHz"
      value_template: "{{ (value | float / 1000) | round(0) }}"
      scan_interval: 86400 # Once per day is sufficient
