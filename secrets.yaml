# Use this file to store secrets like usernames and passwords.
# Learn more at https://www.home-assistant.io/docs/configuration/secrets/
some_password: welcome

# ============================================================
# ERGAENZUNG fuer /config/secrets.yaml
#
# NICHT die vorhandene secrets.yaml ersetzen - diese vier Zeilen unten
# anhaengen. Danach configuration.yaml und pv_forecast_fetch.yaml
# tauschen und neu starten.
#
# Vorher: <ID> und <PASSWORT> durch die echten Werte ersetzen. Das
# AWEKAS-Passwort bitte vorher auf der AWEKAS-Seite neu setzen - das
# alte stand mehrfach im Klartext in Dateien, die den Rechner verlassen
# haben.
# ============================================================

# --- AWEKAS ---------------------------------------------------------
# Eine einzige Zeile, keine Umbrueche: bei einem gefalteten YAML-Block
# landen Leerzeichen mitten in der URL. Die {% %}-Logik wird erst beim
# Aufruf des rest_command gerendert, deshalb funktioniert sie auch hier
# im Secret.
awekas_url: "{% set temp = states('sensor.wetterstation_aussentemperatur') %}{% set hum = states('sensor.wetterstation_luftfeuchtigkeit') %}{% if is_number(temp) and is_number(hum) %}https://ws.awekas.at/weatherstation/updateweatherstation.php?ID=<ID>&PASSWORD=<PASSWORT>&tempf={{ (temp | float * 9/5 + 32) | round(1) }}&humidity={{ hum | int }}&softwaretype=HomeAssistant{% else %}https://ws.awekas.at/weatherstation/updateweatherstation.php?ID=<ID>&PASSWORD=<PASSWORT>&status=offline{% endif %}"

# --- Recorder -------------------------------------------------------
recorder_db_url: "mysql://homeassistant:homeassistant@core-mariadb/homeassistant?charset=utf8mb4"

# --- Forecast.Solar -------------------------------------------------
# Aufbau: .../watthours/<Breite>/<Laenge>/<Neigung>/<Azimut>/<kWp>
pv_forecast_url_dach: "https://api.forecast.solar/estimate/watthours/47.5151/12.0897/20/-45/7.5"
pv_forecast_url_fassade: "https://api.forecast.solar/estimate/watthours/47.5151/12.0897/85/45/2.4"
